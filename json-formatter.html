<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
:root{
  --bg:#f8f8fc; --bg2:#f0f0f8; --surface:rgba(255,255,255,0.90); --card:#ffffff;
  --border:rgba(99,102,241,0.10); --border2:rgba(0,0,0,0.06); --text:#18181b; --muted:#71717a;
  --accent:#6366f1; --accent2:#8b5cf6; --accent3:#06b6d4; --glow:rgba(99,102,241,0.14);
  --green:#10b981; --red:#ef4444; --yellow:#f59e0b;
  --r:16px; --fhead:'Space Grotesk',sans-serif; --fbody:'Plus Jakarta Sans',system-ui,sans-serif;
}
[data-theme="dark"]{
  --bg:#0c0c14; --bg2:#111120; --surface:rgba(18,18,30,0.92); --card:#16162a;
  --border:rgba(99,102,241,0.18); --border2:rgba(255,255,255,0.07); --text:#e4e4f0; --muted:#8888aa;
  --glow:rgba(99,102,241,0.28);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:var(--fbody);min-height:100vh;display:flex;flex-direction:column;transition:.3s;}

/* NAV */
nav{position:sticky;top:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(1rem,5vw,3rem);height:64px;background:var(--surface);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
.nav-left{display:flex;align-items:center;gap:1rem;}
.back-btn{background:var(--card);border:1px solid var(--border);width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text);font-size:1.1rem;cursor:pointer;text-decoration:none;transition:.2s;}
.back-btn:hover{border-color:var(--accent);transform:scale(1.05);}
.nav-logo{display:flex;align-items:center;gap:.55rem;font-family:var(--fhead);font-weight:800;font-size:1.2rem;text-decoration:none;color:inherit;}
.logo-icon{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:1rem;}
.logo-text .pdf{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.logo-text .tools{color:var(--muted);}

.container{max-width:1100px;margin:1.5rem auto;padding:0 20px 3rem;flex:1;width:100%;}
.hero{margin-bottom:1.25rem;}
.hero h1{font-family:var(--fhead);font-size:clamp(1.6rem,4vw,2.3rem);font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.hero p{color:var(--muted);font-size:.92rem;margin-top:.35rem;}

.editor-panel{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
@media(max-width:768px){.editor-panel{grid-template-columns:1fr;}}
.col-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.col-head h3{font-family:var(--fhead);font-size:.95rem;font-weight:700;}
.col-head .mini{font-size:.74rem;color:var(--muted);}
textarea{width:100%;height:420px;padding:14px;border:1px solid var(--border);border-radius:12px;font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.7;resize:vertical;background:var(--card);color:var(--text);tab-size:2;}
textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--glow);}
#outputJson{background:var(--bg2);}
.tree-view{width:100%;height:420px;overflow:auto;border:1px solid var(--border);border-radius:12px;padding:14px;background:var(--bg2);font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.7;display:none;}
.tree-view .tk{color:var(--accent);} .tree-view .ts{color:var(--green);} .tree-view .tn{color:var(--accent2);} .tree-view .tb{color:var(--yellow);} .tree-view .tnull{color:var(--muted);}
.tree-view details{margin-left:1em;} .tree-view summary{cursor:pointer;}

.btn-group{display:flex;gap:10px;flex-wrap:wrap;margin:1.1rem 0;}
.btn{background:var(--card);color:var(--text);border:1px solid var(--border);padding:9px 16px;border-radius:10px;font-weight:600;font-size:.85rem;cursor:pointer;transition:.18s;display:inline-flex;align-items:center;gap:7px;font-family:var(--fbody);}
.btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px);}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;}
.btn-primary:hover{opacity:.92;color:#fff;}
.btn:disabled{opacity:.45;pointer-events:none;}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:.4rem;}
.toolbar label{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:5px;}
.toolbar select{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:5px 9px;font-size:.8rem;font-family:var(--fbody);}

.statusbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:.4rem;}
.chip{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:4px 11px;font-size:.74rem;color:var(--muted);}
.chip b{color:var(--accent);}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:999px;font-size:.74rem;font-weight:600;}
.badge.ok{background:rgba(16,185,129,.12);color:var(--green);border:1px solid rgba(16,185,129,.25);}
.badge.err{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.25);}

#message{margin-top:.8rem;font-size:.88rem;min-height:20px;}
.error-msg{color:var(--red);} .success-msg{color:var(--green);}
footer{text-align:center;padding:1.5rem;color:var(--muted);font-size:.82rem;border-top:1px solid var(--border);margin-top:auto;line-height:1.8;}
.footer-links{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-bottom:6px;}
.footer-links a{color:var(--muted);text-decoration:none;font-weight:500;}
.footer-links a:hover{color:var(--accent);}
</style>
</head>

<nav>
  <div class="nav-left">
    <a href="./index.html" class="back-btn" aria-label="Back"><i class="fa-solid fa-arrow-left"></i></a>
    <a href="./index.html" class="nav-logo"><span class="logo-icon">🛠️</span><span class="logo-text">Img<span class="pdf">PDF</span><span class="tools">Tools</span></span></a>
  </div>
  <button id="themeToggle" class="back-btn" title="Toggle theme" aria-label="Toggle theme">🌓</button>
</nav>

<div class="container">
  <div class="hero">
    <h1>JSON Formatter & Validator</h1>
    <p>Prettify, minify, validate, sort keys, and explore JSON — fast, private, 100% in your browser.</p>
  </div>

  <div class="toolbar">
    <label>Indent
      <select id="indentSel">
        <option value="2" selected>2 spaces</option>
        <option value="4">4 spaces</option>
        <option value="\t">Tab</option>
      </select>
    </label>
    <button class="btn" id="sampleBtn"><i class="fa-solid fa-flask"></i> Sample</button>
    <button class="btn" id="sortBtn"><i class="fa-solid fa-arrow-down-a-z"></i> Sort keys</button>
    <button class="btn" id="treeBtn"><i class="fa-solid fa-sitemap"></i> Tree view</button>
  </div>

  <div class="editor-panel">
    <div>
      <div class="col-head"><h3>Input JSON</h3><span class="mini" id="inMeta">0 chars</span></div>
      <textarea id="inputJson" spellcheck="false" placeholder='Paste your JSON here, e.g. {"hello":"world"}'>{"name":"John","age":30,"city":"New York","hobbies":["reading","coding"]}</textarea>
    </div>
    <div>
      <div class="col-head"><h3>Output</h3><span class="mini" id="validBadge"></span></div>
      <textarea id="outputJson" spellcheck="false" readonly placeholder="Formatted JSON will appear here..."></textarea>
      <div class="tree-view" id="treeView"></div>
    </div>
  </div>

  <div class="btn-group">
    <button class="btn btn-primary" id="formatBtn"><i class="fa-solid fa-wand-magic-sparkles"></i> Format</button>
    <button class="btn" id="minifyBtn"><i class="fa-solid fa-compress"></i> Minify</button>
    <button class="btn" id="validateBtn"><i class="fa-solid fa-circle-check"></i> Validate</button>
    <button class="btn" id="copyBtn" disabled><i class="fa-solid fa-copy"></i> Copy</button>
    <button class="btn" id="downloadBtn" disabled><i class="fa-solid fa-download"></i> .json</button>
    <button class="btn" id="clearBtn"><i class="fa-solid fa-trash"></i> Clear</button>
  </div>

  <div id="message"></div>
  <div class="statusbar" id="statusbar"></div>
</div>

<footer>
  <div class="footer-links">
    <a href="./about.html">About</a>
    <a href="./contact.html">Contact</a>
    <a href="./privacy-policy.html">Privacy</a>
    <a href="./terms.html">Terms</a>
    <a href="./disclaimer.html">Disclaimer</a>
  </div>
  © 2026 ImgPDFTools — <strong>Nothing leaves your device</strong> &nbsp;·&nbsp; Powered by native JSON
</footer>

<script>
(function(){
  'use strict';
  var $=function(id){return document.getElementById(id);};
  var inputEl=$('inputJson'), outputEl=$('outputJson'), msgEl=$('message'),
      treeEl=$('treeView'), statusbar=$('statusbar'), validBadge=$('validBadge'),
      inMeta=$('inMeta'), indentSel=$('indentSel');
  var treeMode=false, lastValid=null;

  // THEME
  $('themeToggle').addEventListener('click', function(){
    var n = document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme', n);
    try{ localStorage.setItem('imgpdftools-theme', n); }catch(e){}
  });

  function getIndent(){ var v=indentSel.value; return v==='\\t' ? '\t' : parseInt(v,10); }

  function showMessage(msg, type){ msgEl.textContent=msg; msgEl.className = type==='error'?'error-msg':'success-msg'; }
  function clearMessage(){ msgEl.textContent=''; msgEl.className=''; }

  // Robust parse with line/column error reporting
  function parseWithPos(text){
    try{ return { ok:true, value: JSON.parse(text) }; }
    catch(e){
      var m = /position (\\d+)/.exec(e.message);
      var info = e.message;
      if(m){
        var pos = parseInt(m[1],10);
        var upto = text.slice(0,pos);
        var line = upto.split('\n').length;
        var col = pos - upto.lastIndexOf('\n');
        info = e.message + ' (line ' + line + ', column ' + col + ')';
      }
      return { ok:false, error: info };
    }
  }

  function setOutput(str, enable){
    outputEl.value = str;
    $('copyBtn').disabled = !enable;
    $('downloadBtn').disabled = !enable;
  }

  function updateInMeta(){ inMeta.textContent = inputEl.value.length.toLocaleString() + ' chars'; }
  inputEl.addEventListener('input', function(){ updateInMeta(); validBadge.textContent=''; }); updateInMeta();

  function setValid(ok){
    validBadge.innerHTML = ok
      ? '<span class="badge ok"><i class="fa-solid fa-check"></i> Valid</span>'
      : '<span class="badge err"><i class="fa-solid fa-xmark"></i> Invalid</span>';
  }

  function showStats(value, raw){
    var bytes = new Blob([raw]).size;
    var keys = 0, depth = 0, arrays = 0;
    (function walk(v, d){
      if(d>depth) depth=d;
      if(Array.isArray(v)){ arrays++; v.forEach(function(x){ walk(x, d+1); }); }
      else if(v && typeof v==='object'){ var k=Object.keys(v); keys+=k.length; k.forEach(function(key){ walk(v[key], d+1); }); }
    })(value, 1);
    statusbar.innerHTML =
      '<span class="chip"><b>'+bytes.toLocaleString()+'</b> bytes</span>'+
      '<span class="chip"><b>'+keys.toLocaleString()+'</b> keys</span>'+
      '<span class="chip"><b>'+arrays.toLocaleString()+'</b> arrays</span>'+
      '<span class="chip">depth <b>'+depth+'</b></span>';
  }

  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function renderTree(value){
    function node(v){
      if(v===null) return '<span class="tnull">null</span>';
      if(typeof v==='string') return '<span class="ts">"'+esc(v)+'"</span>';
      if(typeof v==='number') return '<span class="tn">'+v+'</span>';
      if(typeof v==='boolean') return '<span class="tb">'+v+'</span>';
      if(Array.isArray(v)){
        if(!v.length) return '[]';
        var items = v.map(function(x){ return '<div>'+node(x)+'</div>'; }).join('');
        return '<details open><summary>Array['+v.length+']</summary>'+items+'</details>';
      }
      var keys=Object.keys(v);
      if(!keys.length) return '{}';
      var rows = keys.map(function(k){ return '<div><span class="tk">'+esc(k)+'</span>: '+node(v[k])+'</div>'; }).join('');
      return '<details open><summary>Object{'+keys.length+'}</summary>'+rows+'</details>';
    }
    treeEl.innerHTML = node(value);
  }

  function toggleTree(force){
    treeMode = (force!==undefined)?force:!treeMode;
    outputEl.style.display = treeMode ? 'none' : 'block';
    treeEl.style.display = treeMode ? 'block' : 'none';
    if(treeMode && lastValid!==null) renderTree(lastValid);
  }

  function doFormat(){
    var input = inputEl.value.trim();
    clearMessage();
    if(!input){ showMessage('Please enter JSON data', 'error'); return; }
    var r = parseWithPos(input);
    if(!r.ok){ setValid(false); setOutput('', false); showMessage('✗ Invalid JSON: ' + r.error, 'error'); statusbar.innerHTML=''; return; }
    lastValid = r.value;
    var pretty = JSON.stringify(r.value, null, getIndent());
    setOutput(pretty, true); setValid(true);
    showMessage('✓ JSON formatted successfully', 'success');
    showStats(r.value, pretty);
    if(treeMode) renderTree(r.value);
  }
  function doMinify(){
    var input = inputEl.value.trim();
    clearMessage();
    if(!input){ showMessage('Please enter JSON data', 'error'); return; }
    var r = parseWithPos(input);
    if(!r.ok){ setValid(false); setOutput('', false); showMessage('✗ Invalid JSON: ' + r.error, 'error'); statusbar.innerHTML=''; return; }
    lastValid = r.value;
    var min = JSON.stringify(r.value);
    setOutput(min, true); setValid(true);
    showMessage('✓ JSON minified successfully', 'success');
    showStats(r.value, min);
    if(treeMode) renderTree(r.value);
  }
  function doValidate(){
    var input = inputEl.value.trim();
    clearMessage();
    if(!input){ showMessage('Please enter JSON data', 'error'); return; }
    var r = parseWithPos(input);
    if(r.ok){ setValid(true); lastValid=r.value; showMessage('✓ Valid JSON structure', 'success'); showStats(r.value, input); }
    else { setValid(false); showMessage('✗ Invalid JSON: ' + r.error, 'error'); statusbar.innerHTML=''; }
  }
  function sortKeysDeep(v){
    if(Array.isArray(v)) return v.map(sortKeysDeep);
    if(v && typeof v==='object'){
      var out={}; Object.keys(v).sort().forEach(function(k){ out[k]=sortKeysDeep(v[k]); }); return out;
    }
    return v;
  }

  $('formatBtn').addEventListener('click', doFormat);
  $('minifyBtn').addEventListener('click', doMinify);
  $('validateBtn').addEventListener('click', doValidate);
  $('sortBtn').addEventListener('click', function(){
    var input=inputEl.value.trim(); clearMessage();
    if(!input){ showMessage('Please enter JSON data','error'); return; }
    var r=parseWithPos(input);
    if(!r.ok){ setValid(false); showMessage('✗ Invalid JSON: '+r.error,'error'); return; }
    var sorted=sortKeysDeep(r.value); lastValid=sorted;
    inputEl.value=JSON.stringify(sorted,null,getIndent()); updateInMeta();
    var pretty=JSON.stringify(sorted,null,getIndent()); setOutput(pretty,true); setValid(true);
    showMessage('✓ Keys sorted alphabetically (deep)','success'); showStats(sorted,pretty);
    if(treeMode) renderTree(sorted);
  });
  $('treeBtn').addEventListener('click', function(){ toggleTree(); });
  $('sampleBtn').addEventListener('click', function(){
    inputEl.value=JSON.stringify({id:1,name:'ImgPDFTools',active:true,tags:['json','tool'],meta:{version:2,nested:{a:1,b:[1,2,3]}}},null,2);
    updateInMeta(); doFormat();
  });
  $('copyBtn').addEventListener('click', function(){
    if(!outputEl.value) return;
    navigator.clipboard.writeText(outputEl.value).then(function(){
      var b=$('copyBtn'), o=b.innerHTML; b.innerHTML='<i class="fa-solid fa-check"></i> Copied!';
      setTimeout(function(){ b.innerHTML=o; },1400);
    });
  });
  $('downloadBtn').addEventListener('click', function(){
    if(!outputEl.value) return;
    var blob=new Blob([outputEl.value],{type:'application/json'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='imgpdftools.json'; a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); },5000);
  });
  $('clearBtn').addEventListener('click', function(){
    inputEl.value=''; setOutput('',false); clearMessage(); statusbar.innerHTML=''; validBadge.textContent='';
    treeEl.innerHTML=''; lastValid=null; updateInMeta();
  });
  indentSel.addEventListener('change', function(){ if(lastValid!==null && outputEl.value && !treeMode) doFormat(); });

  // Keyboard: Ctrl/Cmd+Enter to format
  inputEl.addEventListener('keydown', function(e){ if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){ e.preventDefault(); doFormat(); } });
})();
</script>
</body>
