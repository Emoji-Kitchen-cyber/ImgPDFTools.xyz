<html lang="en" data-theme="light">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JPG to PDF — ImgPDFTools</title>
  <meta name="description" content="Combine JPG, PNG and WebP images into a single PDF. Reorder, choose page size, fit, orientation, margins, background and compression. Free, private, in-browser." />
  <link rel="canonical" href="https://imgpdftools.xyz/jpg-to-pdf.html" />
  <meta name="theme-color" content="#6366f1" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root {
      --bg:#f8f8fc; --bg2:#f0f0f8; --surface:rgba(255,255,255,0.90); --card:#ffffff;
      --border:rgba(99,102,241,0.10); --border2:rgba(0,0,0,0.06);
      --text:#18181b; --muted:#71717a;
      --accent:#6366f1; --accent2:#8b5cf6; --accent3:#06b6d4; --glow:rgba(99,102,241,0.14);
      --r:18px; --fhead:'Space Grotesk',sans-serif; --fbody:'Plus Jakarta Sans',system-ui,sans-serif; --nav-h:66px;
    }
    [data-theme="dark"] {
      --bg:#0c0c14; --bg2:#111120; --surface:rgba(18,18,30,0.92); --card:#16162a;
      --border:rgba(99,102,241,0.18); --border2:rgba(255,255,255,0.07);
      --text:#e4e4f0; --muted:#8888aa; --glow:rgba(99,102,241,0.28);
    }
    *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--bg); color:var(--text); font-family:var(--fbody); min-height:100vh;
      display:flex; flex-direction:column; transition:background .3s,color .3s; -webkit-font-smoothing:antialiased; }
    a { color:inherit; text-decoration:none; }

    nav { position:sticky; top:0; z-index:200; display:flex; align-items:center; justify-content:space-between;
      padding:0 clamp(1rem,5vw,3rem); height:var(--nav-h); background:var(--surface);
      backdrop-filter:blur(28px) saturate(180%); -webkit-backdrop-filter:blur(28px) saturate(180%); border-bottom:1px solid var(--border); }
    .nav-left { display:flex; align-items:center; gap:1rem; }
    .back-btn,.control-btn { background:var(--card); border:1px solid var(--border2); width:40px; height:40px;
      border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--text);
      font-size:1rem; cursor:pointer; transition:transform .2s,border-color .2s,box-shadow .2s; }
    .back-btn:hover,.control-btn:hover { transform:scale(1.08); border-color:var(--accent); box-shadow:0 0 0 3px var(--glow); }
    .nav-logo { display:flex; align-items:center; gap:8px; font-family:var(--fhead); font-weight:700; font-size:1.15rem; letter-spacing:-.3px; }
    .logo-icon { width:32px; height:32px; background:linear-gradient(135deg,var(--accent),var(--accent2)); border-radius:9px;
      display:flex; align-items:center; justify-content:center; font-size:16px; box-shadow:0 4px 14px var(--glow); }
    .logo-text-img { color:var(--text); }
    .logo-text-pdf { background:linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .logo-text-tools { color:var(--muted); font-weight:600; }

    .main { flex:1; max-width:1040px; margin:0 auto; width:100%; padding:1.5rem 16px 4rem; display:grid; grid-template-columns:1fr 340px; gap:1.6rem; }
    @media (max-width:820px) { .main { grid-template-columns:1fr; } }

    .upload-card { background:var(--card); border:2px dashed var(--border2); border-radius:var(--r);
      padding:2.5rem 2rem; text-align:center; cursor:pointer; transition:.2s; }
    .upload-card:hover { border-color:var(--accent); background:var(--glow); }
    .upload-card i { font-size:2.6rem; color:var(--accent); }
    .upload-card h2 { font-family:var(--fhead); margin:.8rem 0 .3rem; }
    .upload-card p { color:var(--muted); font-size:.9rem; }
    .upload-card input { display:none; }

    .image-list { display:flex; flex-wrap:wrap; gap:10px; margin-top:1rem; min-height:60px; }
    .image-item { position:relative; width:104px; height:104px; border-radius:12px; overflow:hidden; border:2px solid var(--border2); cursor:grab; background:var(--bg2); }
    .image-item img { width:100%; height:100%; object-fit:cover; display:block; }
    .image-item .remove-btn { position:absolute; top:4px; right:4px; background:rgba(239,68,68,0.92); color:#fff; border:none; border-radius:50%; width:22px; height:22px; font-size:13px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
    .image-item .order-badge { position:absolute; bottom:4px; left:4px; background:rgba(0,0,0,0.7); color:#fff; font-size:.66rem; font-weight:700; padding:2px 7px; border-radius:6px; }
    .count-label { font-size:.82rem; color:var(--muted); margin-top:.6rem; font-weight:600; }

    .settings-panel { background:var(--card); border:1.5px solid var(--border2); border-radius:var(--r); padding:1.4rem; height:fit-content; position:sticky; top:84px; }
    .section-title { font-family:var(--fhead); font-size:1rem; font-weight:700; margin-bottom:1rem; display:flex; align-items:center; gap:8px; }
    .input-group { margin-bottom:1rem; }
    .input-group label { display:block; font-size:.74rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; margin-bottom:5px; }
    .input-group select, .input-group input[type="text"], .input-group input[type="number"] {
      width:100%; padding:10px; border:1.5px solid var(--border2); border-radius:10px; background:var(--bg); color:var(--text); font-size:.9rem; font-family:var(--fbody); outline:none; }
    .input-group input[type="color"] { width:100%; height:40px; padding:3px; border:1.5px solid var(--border2); border-radius:10px; background:var(--bg); cursor:pointer; }
    .btn { padding:11px 20px; border:none; border-radius:11px; font-weight:600; cursor:pointer; transition:.2s; display:inline-flex; align-items:center; gap:6px; font-size:.88rem; width:100%; justify-content:center; font-family:var(--fbody); }
    .btn-primary { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; box-shadow:0 4px 14px var(--glow); }
    .btn-primary:hover { filter:brightness(1.05); }
    .btn:disabled { opacity:.5; pointer-events:none; }

    #toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--text);
      color:var(--bg); padding:11px 20px; border-radius:99px; font-size:13px; font-weight:600; opacity:0;
      pointer-events:none; transition:opacity .3s,transform .3s; z-index:999; box-shadow:0 8px 24px rgba(0,0,0,.2); }
    #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

    footer { text-align:center; padding:30px 20px; color:var(--muted); font-size:13px; border-top:1px solid var(--border2); background:var(--card); margin-top:auto; grid-column:1 / -1; }
    .footer-logo { display:inline-flex; align-items:center; gap:7px; margin-bottom:10px; font-family:var(--fhead); font-weight:700; font-size:1rem; }
  </style>
</head>
<body>
  <nav>
    <div class="nav-left">
      <a href="./index.html" class="back-btn" aria-label="Back to home"><i class="fa-solid fa-arrow-left"></i></a>
      <a href="./index.html" class="nav-logo" aria-label="ImgPDFTools Home">
        <div class="logo-icon">🛠️</div>
        <span><span class="logo-text-img">Img</span><span class="logo-text-pdf">PDF</span><span class="logo-text-tools">Tools</span></span>
      </a>
    </div>
    <button id="themeToggle" class="control-btn" aria-label="Toggle theme">🌓</button>
  </nav>

  <div class="main">
    <div>
      <div class="upload-card" id="dropZone">
        <i class="fa-solid fa-cloud-arrow-up"></i>
        <h2>Drop images or click to upload</h2>
        <p>JPG, PNG, WebP — multiple at once · processed entirely in your browser</p>
        <input type="file" id="fileInput" accept="image/*" multiple />
      </div>
      <div class="image-list" id="imageList"></div>
      <p class="count-label" id="imageCount">0 images added</p>
    </div>

    <div class="settings-panel">
      <div class="section-title"><i class="fa-solid fa-sliders"></i> PDF settings</div>
      <div class="input-group">
        <label>Page size</label>
        <select id="pageSize">
          <option value="a4">A4</option>
          <option value="letter">Letter</option>
          <option value="fit">Fit to image</option>
          <option value="original">Original size</option>
        </select>
      </div>
      <div class="input-group">
        <label>Image fit</label>
        <select id="imageFit">
          <option value="contain">Fit (contain)</option>
          <option value="cover">Fill (cover)</option>
          <option value="stretch">Stretch</option>
        </select>
      </div>
      <div class="input-group">
        <label>Orientation</label>
        <select id="orientation">
          <option value="auto">Auto (per image)</option>
          <option value="portrait">Portrait</option>
          <option value="landscape">Landscape</option>
        </select>
      </div>
      <div class="input-group">
        <label>Margin (mm)</label>
        <input type="number" id="margin" value="5" min="0" max="50" />
      </div>
      <div class="input-group">
        <label>Background</label>
        <input type="color" id="bgColor" value="#ffffff" />
      </div>
      <div class="input-group">
        <label>Compression</label>
        <select id="compression">
          <option value="NONE">None (best quality)</option>
          <option value="FAST">Fast</option>
          <option value="MEDIUM" selected>Medium</option>
          <option value="SLOW">Slow (smallest)</option>
        </select>
      </div>
      <div class="input-group">
        <label>File name</label>
        <input type="text" id="fileName" value="imgpdftools-images-to-pdf" />
      </div>
      <button class="btn btn-primary" id="generateBtn" disabled><i class="fa-solid fa-file-pdf"></i> Generate PDF</button>
    </div>
  </div>

  <div id="toast"></div>

  <footer>
    <div class="footer-logo">
      <div class="logo-icon" style="width:26px;height:26px;font-size:13px;">🛠️</div>
      <span><span class="logo-text-img">Img</span><span class="logo-text-pdf">PDF</span><span class="logo-text-tools">Tools</span></span>
    </div>
    <p>© 2026 ImgPDFTools — All processing happens in your browser.</p>
  </footer>

  <script>
  (function(){
    const $ = id => document.getElementById(id);
    let toastTimer;
    function toast(m){ const t=$('toast'); if(!t) return; t.textContent=m; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1800); }

    /* Safe DOM helpers — never inject dynamic data via innerHTML */
    function el(tag, opts){ opts=opts||{}; const n=document.createElement(tag);
      if(opts.class) n.className=opts.class;
      if(opts.text!=null) n.textContent=opts.text;
      if(opts.attrs) for(const k in opts.attrs) n.setAttribute(k, opts.attrs[k]);
      return n; }
    function clear(node){ while(node && node.firstChild) node.removeChild(node.firstChild); }

    /* Theme (shared key with homepage) */
    function syncTheme(){
      const saved = localStorage.getItem('imgpdftools-theme') || localStorage.getItem('pixelpress-theme');
      document.documentElement.setAttribute('data-theme', saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light'));
    }
    $('themeToggle').addEventListener('click', () => {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light':'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('imgpdftools-theme', next);
    });
    syncTheme();

    const dropZone=$('dropZone'), fileInput=$('fileInput'), imageList=$('imageList'),
      imageCount=$('imageCount'), generateBtn=$('generateBtn');

    const MAX = 50;
    let images = []; // { dataURL, width, height }

    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', e => addFiles([...e.target.files]));
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.style.borderColor='var(--accent)'; });
    dropZone.addEventListener('dragleave', () => dropZone.style.borderColor='');
    dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.style.borderColor=''; addFiles([...e.dataTransfer.files]); });

    function addFiles(files){
      const imageFiles = files.filter(f => f.type.startsWith('image/')).slice(0, MAX - images.length);
      if(!imageFiles.length){ toast('Please add image files'); return; }
      imageFiles.forEach(file => {
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => { images.push({ dataURL: e.target.result, width: img.width, height: img.height }); renderImages(); };
          img.onerror = () => toast('Could not read an image');
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
      fileInput.value='';
    }

    let dragIdx = -1;
    function renderImages(){
      clear(imageList);
      images.forEach((imgData, i) => {
        const item = el('div', { class:'image-item', attrs:{ draggable:'true' } });

        const thumb = el('img', { attrs:{ alt:'image ' + (i+1) } });
        thumb.src = imgData.dataURL; // set as property, never via innerHTML string
        item.appendChild(thumb);

        item.appendChild(el('span', { class:'order-badge', text: String(i+1) }));

        const rm = el('button', { class:'remove-btn', text:'×' });
        rm.addEventListener('click', ev => { ev.stopPropagation(); images.splice(i, 1); renderImages(); });
        item.appendChild(rm);

        /* Drag to reorder */
        item.addEventListener('dragstart', () => { dragIdx = i; item.style.opacity='0.5'; });
        item.addEventListener('dragend', () => { item.style.opacity='1'; dragIdx = -1; });
        item.addEventListener('dragover', ev => ev.preventDefault());
        item.addEventListener('drop', ev => {
          ev.preventDefault();
          if(dragIdx !== -1 && dragIdx !== i){ const [moved] = images.splice(dragIdx, 1); images.splice(i, 0, moved); renderImages(); }
        });

        imageList.appendChild(item);
      });
      imageCount.textContent = images.length + ' image(s) added';
      generateBtn.disabled = images.length === 0;
    }

    generateBtn.addEventListener('click', async () => {
      if(!images.length) return;
      generateBtn.disabled = true;
      const orig = generateBtn.textContent;
      clear(generateBtn);
      generateBtn.appendChild(el('i', { class:'fa-solid fa-spinner fa-spin' }));
      generateBtn.appendChild(document.createTextNode(' Generating…'));

      try {
        const { jsPDF } = window.jspdf;
        const pageSizeSel = $('pageSize').value;
        const imageFit = $('imageFit').value;
        const orientation = $('orientation').value;
        const margin = parseInt($('margin').value, 10) || 0;
        const compression = $('compression').value;
        const bg = $('bgColor').value;
        const PX2MM = 0.264583;

        const doc = new jsPDF({ orientation: orientation === 'auto' ? 'portrait' : orientation, unit:'mm', compress: compression !== 'NONE' });

        for(let i=0;i<images.length;i++){
          const img = images[i];
          if(i > 0) doc.addPage();

          let pageW, pageH;
          if(pageSizeSel === 'a4'){ pageW=210; pageH=297; }
          else if(pageSizeSel === 'letter'){ pageW=215.9; pageH=279.4; }
          else { pageW = img.width * PX2MM; pageH = img.height * PX2MM; }

          if(orientation === 'auto'){ if(pageW > pageH && img.width < img.height){ const t=pageW; pageW=pageH; pageH=t; } }
          else if(orientation === 'landscape' && pageW < pageH){ const t=pageW; pageW=pageH; pageH=t; }
          else if(orientation === 'portrait' && pageW > pageH){ const t=pageW; pageW=pageH; pageH=t; }

          doc.internal.pageSize.width = pageW; doc.internal.pageSize.height = pageH;

          /* paint background */
          doc.setFillColor(bg);
          doc.rect(0, 0, pageW, pageH, 'F');

          const drawW = pageW - margin*2, drawH = pageH - margin*2;
          const imgWmm = img.width * PX2MM, imgHmm = img.height * PX2MM;

          if(imageFit === 'contain'){
            const ratio = Math.min(drawW/imgWmm, drawH/imgHmm);
            const w = imgWmm*ratio, h = imgHmm*ratio;
            doc.addImage(img.dataURL, 'JPEG', margin + (drawW-w)/2, margin + (drawH-h)/2, w, h, undefined, compression);
          } else if(imageFit === 'cover'){
            const ratio = Math.max(drawW/imgWmm, drawH/imgHmm);
            const w = imgWmm*ratio, h = imgHmm*ratio;
            doc.addImage(img.dataURL, 'JPEG', margin + (drawW-w)/2, margin + (drawH-h)/2, w, h, undefined, compression);
          } else {
            doc.addImage(img.dataURL, 'JPEG', margin, margin, drawW, drawH, undefined, compression);
          }
        }

        let name = ($('fileName').value || 'imgpdftools-images-to-pdf').trim().replace(/[\\/:*?"<>|]+/g, '-');
        if(!/\.pdf$/i.test(name)) name += '.pdf';
        doc.save(name);
        toast('PDF ready');
      } catch(err){ console.error(err); toast('Could not generate PDF'); }
      finally {
        generateBtn.disabled = false;
        clear(generateBtn);
        generateBtn.appendChild(el('i', { class:'fa-solid fa-file-pdf' }));
        generateBtn.appendChild(document.createTextNode(' Generate PDF'));
      }
    });
  })();
  </script>
</body>
</html>
