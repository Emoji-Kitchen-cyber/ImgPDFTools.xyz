<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Blog Writer - PixelPress</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: system-ui, sans-serif; background: #f5f5f7; color: #1d1d1f; min-height: 100vh; margin: 0; padding: 20px; }
    [data-theme="dark"] body { background: #09090e; color: #e8e8f0; }
    .container { max-width: 700px; margin: 0 auto; }
    textarea { width: 100%; min-height: 120px; padding: 12px; border: 1px solid #ddd; border-radius: 10px; font-size: 1rem; font-family: inherit; margin-bottom: 1rem; }
    button { width: 100%; padding: 14px; background: #ec4899; color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: 0.5; }
    .result { background: white; padding: 20px; border-radius: 10px; min-height: 150px; margin-top: 1rem; white-space: pre-wrap; }
    [data-theme="dark"] .result { background: #15151e; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🤖 AI Blog Writer</h1>
    <textarea id="prompt" placeholder="Enter your topic..."></textarea>
    <button id="btn" onclick="generate()">Generate Content</button>
    <div class="result" id="result"></div>
  </div>
  <script>
    async function generate() {
      const prompt = document.getElementById('prompt').value.trim();
      if (!prompt) return;
      
      const btn = document.getElementById('btn');
      btn.disabled = true;
      btn.textContent = 'Generating...';
      document.getElementById('result').textContent = '';
      
      try {
        const res = await fetch('/api/ai-write', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt })
        });
        const data = await res.json();
        document.getElementById('result').textContent = data.text;
      } catch (e) {
        document.getElementById('result').textContent = 'Error: ' + e.message;
      }
      
      btn.disabled = false;
      btn.textContent = 'Generate Content';
    }
  </script>
</body>
</html>
