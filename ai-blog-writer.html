<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Blog Writer – PixelPress</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root{--bg:#f5f5f7;--card:#fff;--border:rgba(0,0,0,0.06);--text:#1d1d1f;--muted:#6e6e73;--accent:#ec4899;--r:16px}
    [data-theme="dark"]{--bg:#09090e;--card:#15151e;--border:rgba(255,255,255,0.08);--text:#e8e8f0;--muted:#86868b}
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;transition:0.3s}
    nav{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:60px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0}
    .logo{font-weight:800;font-size:1.1rem;text-decoration:none;color:var(--text)}
    .logo span{background:linear-gradient(135deg,var(--accent),#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .main{flex:1;max-width:700px;margin:0 auto;padding:2rem 16px;width:100%}
    h1{font-size:1.8rem;text-align:center;margin-bottom:1.5rem}
    textarea{width:100%;min-height:120px;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font-size:1rem;resize:vertical;font-family:inherit;margin-bottom:1rem}
    .btn{width:100%;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer}
    .btn:disabled{opacity:0.5}
    .result{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:1.5rem;margin-top:1.5rem;min-height:150px;white-space:pre-wrap;line-height:1.7}
    footer{text-align:center;padding:2rem;color:var(--muted);font-size:0.85rem;border-top:1px solid var(--border);margin-top:auto}
  </style>
</head>
<body>
  <nav>
    <a href="./index.html" class="logo">PIXEL<span>PRESS</span></a>
    <button id="themeBtn" style="background:var(--card);border:1px solid var(--border);width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:1.1rem">🌓</button>
  </nav>
  <div class="main">
    <h1>🤖 AI Blog Writer</h1>
    <textarea id="prompt" placeholder="Enter your topic or prompt here..."></textarea>
    <button class="btn" id="generateBtn" onclick="generate()"><i class="fa-solid fa-wand-magic-sparkles"></i> Generate</button>
    <div class="result" id="result"></div>
  </div>
  <footer>© 2026 PixelPress</footer>

  <script>
    document.getElementById('themeBtn').onclick=()=>{
      const c=document.documentElement.getAttribute('data-theme');
      const n=c==='dark'?'light':'dark';
      document.documentElement.setAttribute('data-theme',n);
      localStorage.setItem('pixelpress-theme',n);
    };
    (()=>{document.documentElement.setAttribute('data-theme',localStorage.getItem('pixelpress-theme')||'light')})();

    async function generate(){
      const p=document.getElementById('prompt').value.trim();
      if(!p) return;
      const btn=document.getElementById('generateBtn');
      btn.disabled=true; btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Please wait...';
      document.getElementById('result').textContent='';
      try{
        const res=await fetch('/api/ai-write',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:p})});
        const data=await res.json();
        document.getElementById('result').textContent=data.text||'No response';
      }catch(e){
        document.getElementById('result').textContent='Error: '+e.message;
      }
      btn.disabled=false; btn.innerHTML='<i class="fa-solid fa-wand-magic-sparkles"></i> Generate';
    }
  </script>
</body>
</html>
