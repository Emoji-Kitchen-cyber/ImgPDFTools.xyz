<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Batch Image Converter — ImgPDFTools</title>
  <meta name="description" content="Convert images in bulk to WebP, JPEG, PNG or AVIF in your browser. Resize, apply social-media presets, strip metadata, and download as a ZIP. Free & private." />
  <link rel="canonical" href="https://imgpdftools.xyz/convert.html" />
  <meta name="theme-color" content="#6366f1" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" />
  <style>
    :root {
      --bg:#f8f8fc; --bg2:#f0f0f8; --surface:rgba(255,255,255,0.90); --card:#ffffff;
      --border:rgba(99,102,241,0.10); --border2:rgba(0,0,0,0.06);
      --text:#18181b; --muted:#71717a;
      --accent:#6366f1; --accent2:#8b5cf6; --accent3:#06b6d4; --glow:rgba(99,102,241,0.14);
      --green:#10b981; --red:#ef4444;
      --r:18px; --r-sm:12px;
      --fhead:'Space Grotesk',sans-serif; --fbody:'Plus Jakarta Sans',system-ui,sans-serif; --nav-h:66px;
    }
    [data-theme="dark"] {
      --bg:#0c0c14; --bg2:#111120; --surface:rgba(18,18,30,0.92); --card:#16162a;
      --border:rgba(99,102,241,0.18); --border2:rgba(255,255,255,0.07);
      --text:#e4e4f0; --muted:#8888aa; --glow:rgba(99,102,241,0.28);
    }
    *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--bg); color:var(--text); font-family:var(--fbody); min-height:100vh;
      display:flex; flex-direction:column; transition:background .3s,color .3s; -webkit-font-smoothing:antialiased; }
    a { color:inherit; text-decoration:none; }

    nav { position:sticky; top:0; z-index:200; display:flex; align-items:center; justify-content:space-between;
      padding:0 clamp(1rem,5vw,3rem); height:var(--nav-h); background:var(--surface);
      backdrop-filter:blur(28px) saturate(180%); -webkit-backdrop-filter:blur(28px) saturate(180%); border-bottom:1px solid var(--border); }
    .nav-left { display:flex; align-items:center; gap:1rem; }
    .back-btn,.control-btn { background:var(--card); border:1px solid var(--border2); width:40px; height:40px;
      border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--text);
      font-size:1rem; cursor:pointer; transition:transform .2s,border-color .2s,box-shadow .2s; }
    .back-btn:hover,.control-btn:hover { transform:scale(1.08); border-color:var(--accent); box-shadow:0 0 0 3px var(--glow); }
    .nav-logo { display:flex; align-items:center; gap:8px; font-family:var(--fhead); font-weight:700; font-size:1.15rem; letter-spacing:-.3px; }
    .logo-icon { width:32px; height:32px; background:linear-gradient(135deg,var(--accent),var(--accent2)); border-radius:9px;
      display:flex; align-items:center; justify-content:center; font-size:16px; box-shadow:0 4px 14px var(--glow); }
    .logo-text-img { color:var(--text); }
    .logo-text-pdf { background:linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .logo-text-tools { color:var(--muted); font-weight:600; }

    .main { flex:1; max-width:1120px; margin:0 auto; width:100%; padding:2rem 20px 4rem; display:grid; grid-template-columns:1fr 360px; gap:1.6rem; }
    @media (max-width:850px){ .main { grid-template-columns:1fr; } .settings-panel { position:static !important; } }

    .upload-panel { background:var(--card); border:1.5px solid var(--border2); border-radius:var(--r);
      padding:1.8rem; display:flex; flex-direction:column; }
    .drop-zone { border:2px dashed var(--border2); border-radius:var(--r); padding:2.5rem; text-align:center; cursor:pointer; transition:.2s; margin-bottom:1.5rem; }
    .drop-zone:hover { border-color:var(--accent); background:var(--glow); }
    .drop-zone i { font-size:2.5rem; color:var(--accent); }
    .drop-zone h2 { font-family:var(--fhead); font-weight:700; margin-top:.6rem; font-size:1.15rem; }
    .drop-zone input { display:none; }

    .queue-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; }
    .queue-header h3 { font-family:var(--fhead); font-weight:700; }
    .queue-item { display:flex; align-items:center; gap:12px; padding:11px; border:1px solid var(--border2); border-radius:12px; margin-bottom:8px; background:var(--bg); }
    .queue-item img { width:48px; height:48px; object-fit:cover; border-radius:8px; }
    .queue-item .info { flex:1; min-width:0; }
    .queue-item .info .name { font-weight:600; font-size:.9rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .queue-item .info .size { font-size:.75rem; color:var(--muted); }
    .queue-item .actions { display:flex; gap:6px; align-items:center; }
    .badge { padding:3px 11px; border-radius:999px; font-size:.7rem; font-weight:700; }
    .badge-ready { background:rgba(113,113,122,0.12); color:var(--muted); }
    .badge-processing { background:var(--glow); color:var(--accent); }
    .badge-done { background:rgba(16,185,129,0.12); color:var(--green); }
    .badge-error { background:rgba(239,68,68,0.12); color:var(--red); }

    .btn { padding:9px 16px; border-radius:10px; border:none; font-weight:600; cursor:pointer; font-size:.85rem;
      transition:.2s; display:inline-flex; align-items:center; gap:6px; font-family:var(--fbody); }
    .btn-primary { background:var(--accent); color:#fff; box-shadow:0 4px 14px var(--glow); }
    .btn-primary:hover { background:var(--accent2); }
    .btn-success { background:var(--green); color:#fff; }
    .btn-success:hover { background:#059669; }
    .btn-danger { background:var(--red); color:#fff; width:34px; height:34px; justify-content:center; padding:0; }
    .btn-outline { background:transparent; border:1.5px solid var(--border2); color:var(--text); }
    .btn-outline:hover { border-color:var(--accent); color:var(--accent); }
    .btn-icon { background:var(--card); border:1px solid var(--border2); color:var(--text); width:34px; height:34px; justify-content:center; padding:0; border-radius:8px; }
    .btn-icon:hover { border-color:var(--accent); color:var(--accent); }
    .btn:disabled { opacity:.5; pointer-events:none; }

    .progress-bar { height:7px; background:var(--bg2); border-radius:10px; margin:1rem 0; display:none; overflow:hidden; }
    .progress-fill { height:100%; background:linear-gradient(90deg,var(--accent),var(--accent3)); width:0%; border-radius:10px; transition:width .3s; }

    .summary { display:none; gap:12px; margin:1rem 0; flex-wrap:wrap; }
    .summary.show { display:flex; }
    .sum-card { flex:1; min-width:100px; padding:12px; background:var(--bg); border:1px solid var(--border2); border-radius:12px; text-align:center; }
    .sum-card span { display:block; font-size:11px; color:var(--muted); font-weight:600; margin-bottom:5px; }
    .sum-card strong { font-size:1.1rem; color:var(--accent); font-family:var(--fhead); }

    .preview-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:10px; margin-top:1rem; }
    .preview-item { position:relative; border-radius:10px; overflow:hidden; background:var(--bg); border:1px solid var(--border2); aspect-ratio:1; }
    .preview-item img { width:100%; height:100%; object-fit:cover; display:block; }
    .preview-item .size-tag { position:absolute; bottom:5px; left:5px; background:rgba(0,0,0,0.65); color:#fff; font-size:.62rem; padding:2px 6px; border-radius:5px; }
    .preview-item .dl { position:absolute; top:5px; right:5px; width:26px; height:26px; border-radius:7px; border:none; background:rgba(0,0,0,0.55); color:#fff; cursor:pointer; font-size:.7rem; display:flex; align-items:center; justify-content:center; opacity:0; transition:.2s; }
    .preview-item:hover .dl { opacity:1; }

    .settings-panel { background:var(--card); border:1.5px solid var(--border2); border-radius:var(--r); padding:1.5rem; height:fit-content; position:sticky; top:84px; }
    .section-title { font-family:var(--fhead); font-size:1rem; font-weight:700; margin-bottom:1.2rem; display:flex; align-items:center; gap:8px; }
    .section-title i { color:var(--accent); }
    .input-group { margin-bottom:1.2rem; }
    .input-group > label { display:block; font-size:.74rem; font-weight:700; color:var(--muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:.4px; }
    .input-group select, .input-group input[type=number], .input-group input[type=text] {
      width:100%; padding:10px 12px; border:1.5px solid var(--border2); border-radius:10px; background:var(--bg); color:var(--text); font-size:.9rem; font-family:var(--fbody); outline:none; transition:border-color .2s,box-shadow .2s; }
    .input-group select:focus, .input-group input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--glow); }
    .input-group input[type=range] { width:100%; accent-color:var(--accent); cursor:pointer; }
    .range-row { display:flex; align-items:center; gap:10px; }
    .range-row span { min-width:42px; font-weight:700; color:var(--accent); font-size:13px; text-align:right; }
    .dimension-row { display:flex; gap:8px; align-items:center; }
    .dimension-row input { flex:1; min-width:0; }
    .dimension-row span { color:var(--muted); }
    .preset-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
    .preset-btn { padding:9px; font-size:.74rem; font-weight:600; border-radius:9px; background:var(--bg); border:1.5px solid var(--border2); cursor:pointer; text-align:center; transition:.2s; color:var(--text); }
    .preset-btn:hover { border-color:var(--accent); color:var(--accent); }
    .smart-recommend { background:var(--glow); border:1px solid var(--border); border-radius:10px; padding:9px 12px; font-size:.8rem; color:var(--muted); margin-top:8px; }

    .switch-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:.9rem; }
    .switch-row label { font-size:.85rem; font-weight:600; }
    .switch { position:relative; width:42px; height:23px; flex-shrink:0; }
    .switch input { opacity:0; width:0; height:0; }
    .switch .tog { position:absolute; inset:0; background:#c4c4d8; border-radius:99px; cursor:pointer; transition:.3s; }
    [data-theme="dark"] .switch .tog { background:#2a2a42; }
    .switch .tog::before { content:''; position:absolute; width:17px; height:17px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.3s; }
    .switch input:checked + .tog { background:var(--accent); }
    .switch input:checked + .tog::before { transform:translateX(19px); }

    .history-panel { margin-top:.8rem; border:1px solid var(--border2); border-radius:10px; padding:10px 12px; font-size:.78rem; color:var(--muted); display:none; max-height:160px; overflow-y:auto; }
    .history-panel.show { display:block; }
    .history-panel div { padding:4px 0; border-bottom:1px dashed var(--border2); }
    .history-panel div:last-child { border-bottom:none; }

    #toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--text);
      color:var(--bg); padding:11px 20px; border-radius:99px; font-size:13px; font-weight:600; opacity:0;
      pointer-events:none; transition:opacity .3s,transform .3s; z-index:999; box-shadow:0 8px 24px rgba(0,0,0,.2); }
    #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

    footer { text-align:center; padding:30px 20px; color:var(--muted); font-size:13px; border-top:1px solid var(--border2); background:var(--card); margin-top:auto; }
    .footer-logo { display:inline-flex; align-items:center; gap:7px; margin-bottom:10px; font-family:var(--fhead); font-weight:700; font-size:1rem; }
  </style>
</head>
<body>
  <nav>
    <div class="nav-left">
      <a href="./index.html" class="back-btn" aria-label="Back to home"><i class="fa-solid fa-arrow-left"></i></a>
      <a href="./index.html" class="nav-logo" aria-label="ImgPDFTools Home">
        <div class="logo-icon">🛠️</div>
        <span><span class="logo-text-img">Img</span><span class="logo-text-pdf">PDF</span><span class="logo-text-tools">Tools</span></span>
      </a>
    </div>
    <button id="themeToggle" class="control-btn" aria-label="Toggle theme">🌓</button>
  </nav>

  <div class="main">
    <!-- Upload & Queue -->
    <div class="upload-panel">
      <div class="drop-zone" id="dropZone">
        <i class="fa-solid fa-cloud-arrow-up"></i>
        <h2>Drop images or click to upload</h2>
        <p style="color:var(--muted); margin-top:0.5rem;">JPG, PNG, WebP, AVIF, GIF, BMP — multiple at once (up to 50)</p>
        <input type="file" id="fileInput" accept="image/*" multiple />
      </div>

      <div class="queue-container" id="queueContainer" style="display:none;">
        <div class="queue-header">
          <h3>Queue (<span id="queueCount">0</span>)</h3>
          <button class="btn btn-outline" id="clearQueueBtn"><i class="fa-solid fa-trash"></i> Clear</button>
        </div>
        <div id="queueList"></div>
        <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
        <p id="statusMessage" style="font-size:0.82rem; color:var(--muted);"></p>
        <div class="summary" id="summary">
          <div class="sum-card"><span>Original</span><strong id="sumOrig">—</strong></div>
          <div class="sum-card"><span>Converted</span><strong id="sumConv">—</strong></div>
          <div class="sum-card"><span>Saved</span><strong id="sumSaved">—</strong></div>
        </div>
        <div class="preview-grid" id="resultPreview"></div>
      </div>
    </div>

    <!-- Settings Panel -->
    <div class="settings-panel" id="settingsPanel" style="display:none;">
      <div class="section-title"><i class="fa-solid fa-sliders"></i> Conversion Settings</div>

      <div class="input-group">
        <label>Output format</label>
        <select id="formatSelect">
          <option value="image/webp">WebP (smallest)</option>
          <option value="image/jpeg">JPEG</option>
          <option value="image/png">PNG (lossless)</option>
          <option value="image/avif">AVIF (next-gen)</option>
        </select>
        <div class="smart-recommend" id="smartRecommend" style="display:none;"></div>
      </div>

      <div class="input-group" id="qualityGroup">
        <label>Quality</label>
        <div class="range-row">
          <input type="range" id="qualitySlider" min="5" max="100" value="80" />
          <span id="qualityValue">80%</span>
        </div>
      </div>

      <div class="input-group" id="bgGroup" style="display:none;">
        <label>JPEG background (transparent areas)</label>
        <input type="color" id="bgColor" value="#ffffff" style="height:42px; padding:3px; cursor:pointer;" />
      </div>

      <div class="input-group">
        <label>Resize mode</label>
        <select id="resizeMode">
          <option value="none">No resize (keep original)</option>
          <option value="fit">Max fit (within W×H)</option>
          <option value="exact">Exact W×H (may stretch)</option>
          <option value="scale">Scale by %</option>
        </select>
      </div>

      <div class="input-group" id="dimGroup" style="display:none;">
        <label>Dimensions (px)</label>
        <div class="dimension-row">
          <input type="number" id="resizeWidth" placeholder="Width" min="1" />
          <span>×</span>
          <input type="number" id="resizeHeight" placeholder="Height" min="1" />
          <button class="btn-icon" id="lockAspectBtn" title="Lock aspect ratio">🔒</button>
        </div>
      </div>

      <div class="input-group" id="scaleGroup" style="display:none;">
        <label>Scale</label>
        <div class="range-row">
          <input type="range" id="scaleSlider" min="10" max="200" value="100" />
          <span id="scaleValue">100%</span>
        </div>
      </div>

      <div class="input-group">
        <label>Social media presets</label>
        <div class="preset-grid" id="presetGrid">
          <button class="preset-btn" data-preset="instagram">Instagram 1080×1080</button>
          <button class="preset-btn" data-preset="igstory">IG Story 1080×1920</button>
          <button class="preset-btn" data-preset="facebook">Facebook 1200×630</button>
          <button class="preset-btn" data-preset="twitter">Twitter 1200×675</button>
          <button class="preset-btn" data-preset="linkedin">LinkedIn 1200×627</button>
          <button class="preset-btn" data-preset="pinterest">Pinterest 1000×1500</button>
          <button class="preset-btn" data-preset="youtube">YouTube 1280×720</button>
          <button class="preset-btn" data-preset="favicon">Favicon 512×512</button>
        </div>
      </div>

      <div class="input-group">
        <label>Output filename</label>
        <div class="dimension-row">
          <input type="text" id="prefix" placeholder="Prefix" />
          <input type="text" id="suffix" placeholder="Suffix" />
        </div>
      </div>

      <div class="switch-row">
        <label for="stripMeta">Strip metadata (EXIF)</label>
        <span class="switch"><input type="checkbox" id="stripMeta" checked /><span class="tog"></span></span>
      </div>

      <button class="btn btn-primary" id="convertAllBtn" style="width:100%;"><i class="fa-solid fa-rotate"></i> Convert all</button>
      <button class="btn btn-success" id="downloadZipBtn" disabled style="width:100%; margin-top:.5rem;"><i class="fa-solid fa-file-zipper"></i> Download all (ZIP)</button>
      <button class="btn btn-outline" id="cancelBtn" style="width:100%; margin-top:.5rem; display:none;"><i class="fa-solid fa-stop"></i> Cancel</button>
      <button class="btn btn-outline" id="historyBtn" style="width:100%; margin-top:.5rem;"><i class="fa-solid fa-clock-rotate-left"></i> History</button>
      <div class="history-panel" id="historyPanel"></div>
    </div>
  </div>

  <div id="toast"></div>

  <footer>
    <div class="footer-logo">
      <div class="logo-icon" style="width:26px;height:26px;font-size:13px;">🛠️</div>
      <span><span class="logo-text-img">Img</span><span class="logo-text-pdf">PDF</span><span class="logo-text-tools">Tools</span></span>
    </div>
    <p>© 2026 ImgPDFTools — All conversions happen in your browser.</p>
  </footer>

  <script>
  (function(){
    const $ = id => document.getElementById(id);
    let toastTimer;
    function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1800); }

    /* Theme (shared key with homepage) */
    function syncTheme(){
      const saved = localStorage.getItem('imgpdftools-theme') || localStorage.getItem('pixelpress-theme');
      document.documentElement.setAttribute('data-theme', saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light'));
    }
    $('themeToggle').addEventListener('click', () => {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light':'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('imgpdftools-theme', next);
    });
    syncTheme();

    /* DOM */
    const dropZone=$('dropZone'), fileInput=$('fileInput'), queueContainer=$('queueContainer'),
      queueList=$('queueList'), queueCount=$('queueCount'), settingsPanel=$('settingsPanel'),
      formatSelect=$('formatSelect'), qualityGroup=$('qualityGroup'), qualitySlider=$('qualitySlider'),
      qualityValue=$('qualityValue'), smartRecommend=$('smartRecommend'), bgGroup=$('bgGroup'),
      resizeMode=$('resizeMode'), dimGroup=$('dimGroup'), scaleGroup=$('scaleGroup'),
      resizeWidth=$('resizeWidth'), resizeHeight=$('resizeHeight'), lockAspectBtn=$('lockAspectBtn'),
      scaleSlider=$('scaleSlider'), scaleValue=$('scaleValue'),
      convertAllBtn=$('convertAllBtn'), downloadZipBtn=$('downloadZipBtn'), cancelBtn=$('cancelBtn'),
      progressBar=$('progressBar'), progressFill=$('progressFill'), resultPreview=$('resultPreview'),
      statusMessage=$('statusMessage'), clearQueueBtn=$('clearQueueBtn'), summary=$('summary');

    let filesQueue=[], convertedResults=[], isProcessing=false, cancelRequested=false, aspectLocked=false, originalAspect=1;

    /* Detect AVIF encode support */
    let avifSupported=false;
    (function(){ try { const c=document.createElement('canvas'); c.width=c.height=2; avifSupported = c.toDataURL('image/avif').indexOf('image/avif')===5; } catch(e){ avifSupported=false; } })();

    /* Format quality / bg toggles */
    const qualityFormats={ 'image/jpeg':true,'image/webp':true,'image/avif':true,'image/png':false };
    function syncFormatUI(){
      const f=formatSelect.value;
      qualityGroup.style.display = qualityFormats[f] ? 'block':'none';
      bgGroup.style.display = (f==='image/jpeg') ? 'block':'none';
      if(f==='image/avif' && !avifSupported){ smartRecommend.style.display='block'; smartRecommend.textContent='⚠️ Your browser can\'t encode AVIF — files will fall back to WebP.'; }
    }
    formatSelect.addEventListener('change', syncFormatUI);
    qualitySlider.addEventListener('input', () => qualityValue.textContent=qualitySlider.value+'%');
    scaleSlider.addEventListener('input', () => scaleValue.textContent=scaleSlider.value+'%');

    /* Resize mode toggles */
    resizeMode.addEventListener('change', () => {
      const m=resizeMode.value;
      dimGroup.style.display = (m==='fit'||m==='exact') ? 'block':'none';
      scaleGroup.style.display = (m==='scale') ? 'block':'none';
    });

    /* Aspect lock */
    lockAspectBtn.addEventListener('click', () => {
      aspectLocked=!aspectLocked;
      lockAspectBtn.textContent = aspectLocked ? '🔓':'🔒';
      if(aspectLocked && resizeWidth.value && resizeHeight.value) originalAspect=parseFloat(resizeWidth.value)/parseFloat(resizeHeight.value);
    });
    resizeWidth.addEventListener('input', () => { if(aspectLocked && resizeWidth.value) resizeHeight.value=Math.round(parseFloat(resizeWidth.value)/originalAspect); });
    resizeHeight.addEventListener('input', () => { if(aspectLocked && resizeHeight.value) resizeWidth.value=Math.round(parseFloat(resizeHeight.value)*originalAspect); });

    /* Presets */
    $('presetGrid').addEventListener('click', e => {
      const btn=e.target.closest('.preset-btn'); if(!btn) return;
      const d={ instagram:[1080,1080], igstory:[1080,1920], facebook:[1200,630], twitter:[1200,675], linkedin:[1200,627], pinterest:[1000,1500], youtube:[1280,720], favicon:[512,512] }[btn.dataset.preset];
      if(resizeMode.value==='none'||resizeMode.value==='scale'){ resizeMode.value='fit'; resizeMode.dispatchEvent(new Event('change')); }
      resizeWidth.value=d[0]; resizeHeight.value=d[1];
      if(aspectLocked) originalAspect=d[0]/d[1];
      toast(`Preset: ${d[0]}×${d[1]}`);
    });

    /* Upload */
    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', e => { addFiles([...e.target.files]); fileInput.value=''; });
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.style.borderColor='var(--accent)'; dropZone.style.background='var(--glow)'; });
    dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor=''; dropZone.style.background=''; });
    dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.style.borderColor=''; dropZone.style.background=''; addFiles([...e.dataTransfer.files]); });

    function addFiles(files){
      const imageFiles=files.filter(f=>f.type.startsWith('image/')).slice(0,50-filesQueue.length);
      if(!imageFiles.length){ toast('No valid images'); return; }
      filesQueue.push(...imageFiles);
      renderQueue();
      queueContainer.style.display='block';
      settingsPanel.style.display='block';
      smartRecommendation();
      syncFormatUI();
    }

    function smartRecommendation(){
      if(!filesQueue.length) return;
      const reader=new FileReader();
      reader.onload=e=>{
        const img=new Image();
        img.onload=()=>{
          const hasTransparency=detectTransparency(img);
          const isPhoto=(img.width>200 && img.height>200);
          let msg='';
          if(hasTransparency){ msg='ℹ️ Transparency detected → PNG or WebP recommended.'; formatSelect.value='image/webp'; }
          else if(isPhoto){ msg='ℹ️ Photo detected → WebP gives best compression.'; formatSelect.value='image/webp'; }
          else { msg='ℹ️ Graphic/icon → PNG may look sharper.'; formatSelect.value='image/png'; }
          smartRecommend.style.display='block'; smartRecommend.textContent=msg;
          syncFormatUI();
        };
        img.src=e.target.result;
      };
      reader.readAsDataURL(filesQueue[0]);
    }

    function detectTransparency(img){
      const c=document.createElement('canvas'); c.width=Math.min(img.width,200); c.height=Math.min(img.height,200);
      const ctx=c.getContext('2d'); ctx.drawImage(img,0,0,c.width,c.height);
      const data=ctx.getImageData(0,0,c.width,c.height).data;
      for(let i=3;i<data.length;i+=4){ if(data[i]<255) return true; }
      return false;
    }

    /* SECURE: queue rows are built with createElement; the user-controlled
       file name is set via textContent (never innerHTML), so a malicious
       file name cannot inject or execute HTML. */
    function renderQueue(){
      queueCount.textContent=filesQueue.length;
      queueList.textContent='';
      filesQueue.forEach((file,idx)=>{
        const item=document.createElement('div');
        item.className='queue-item'; item.id='item-'+idx;

        const img=document.createElement('img');
        img.src=URL.createObjectURL(file); img.alt='preview';

        const info=document.createElement('div'); info.className='info';
        const name=document.createElement('div'); name.className='name';
        name.textContent=file.name; name.title=file.name;
        const size=document.createElement('div'); size.className='size'; size.id='size-'+idx;
        size.textContent=formatBytes(file.size);
        info.appendChild(name); info.appendChild(size);

        const actions=document.createElement('div'); actions.className='actions';
        const badge=document.createElement('span'); badge.className='badge badge-ready'; badge.id='badge-'+idx;
        badge.textContent='Ready';
        const rm=document.createElement('button'); rm.className='btn-danger';
        const xi=document.createElement('i'); xi.className='fa-solid fa-xmark'; rm.appendChild(xi);
        rm.addEventListener('click', () => {
          filesQueue.splice(idx,1);
          convertedResults=[];
          renderQueue();
          if(!filesQueue.length){ queueContainer.style.display='none'; settingsPanel.style.display='none'; }
          resultPreview.textContent=''; summary.classList.remove('show'); downloadZipBtn.disabled=true;
        });
        actions.appendChild(badge); actions.appendChild(rm);

        item.appendChild(img); item.appendChild(info); item.appendChild(actions);
        queueList.appendChild(item);
      });
    }

    clearQueueBtn.addEventListener('click', () => {
      filesQueue=[]; convertedResults=[]; renderQueue();
      queueContainer.style.display='none'; settingsPanel.style.display='none';
      resultPreview.textContent=''; summary.classList.remove('show'); downloadZipBtn.disabled=true;
    });

    convertAllBtn.addEventListener('click', startConversion);
    cancelBtn.addEventListener('click', () => { cancelRequested=true; cancelBtn.style.display='none'; statusMessage.textContent='Cancelling…'; });

    function targetExt(){ const f= (formatSelect.value==='image/avif' && !avifSupported) ? 'image/webp' : formatSelect.value; return f.split('/')[1]; }

    async function startConversion(){
      if(!filesQueue.length || isProcessing) return;
      isProcessing=true; cancelRequested=false;
      convertAllBtn.disabled=true; cancelBtn.style.display='inline-flex';
      progressBar.style.display='block'; progressFill.style.width='0%';
      statusMessage.textContent='Starting…'; convertedResults=[]; downloadZipBtn.disabled=true;
      resultPreview.textContent=''; summary.classList.remove('show');

      let format=formatSelect.value;
      if(format==='image/avif' && !avifSupported) format='image/webp';
      const quality=parseFloat(qualitySlider.value)/100;
      const mode=resizeMode.value;
      const w=resizeWidth.value?parseInt(resizeWidth.value):null;
      const h=resizeHeight.value?parseInt(resizeHeight.value):null;
      const scale=parseInt(scaleSlider.value)/100;
      const total=filesQueue.length;

      for(let i=0;i<total;i++){
        if(cancelRequested) break;
        const file=filesQueue[i];
        updateBadge(i,'processing','Processing…');
        statusMessage.textContent=`Converting ${i+1}/${total}…`;
        try {
          const blob=await convertImage(file,format,quality,mode,w,h,scale);
          convertedResults.push({ idx:i, name:file.name, blob, size:blob.size });
          updateBadge(i,'done','Done');
          const sEl=$('size-'+i); if(sEl) sEl.textContent=formatBytes(file.size)+' → '+formatBytes(blob.size);
          addPreviewImage(i,blob,file.name);
        } catch(err){ updateBadge(i,'error','Failed'); console.error(err); }
        progressFill.style.width=((i+1)/total*100)+'%';
      }

      progressBar.style.display='none'; cancelBtn.style.display='none';
      convertAllBtn.disabled=false; isProcessing=false;
      if(!cancelRequested){
        statusMessage.textContent=`Completed ${convertedResults.length}/${total} files`;
        downloadZipBtn.disabled=convertedResults.length===0;
        showSummary();
        if(convertedResults.length){ saveHistory(convertedResults.length, format, quality); toast('Conversion complete'); }
      } else { statusMessage.textContent='Cancelled'; }
    }

    function showSummary(){
      if(!convertedResults.length) return;
      const orig=convertedResults.reduce((a,r)=>a+filesQueue[r.idx].size,0);
      const conv=convertedResults.reduce((a,r)=>a+r.size,0);
      $('sumOrig').textContent=formatBytes(orig);
      $('sumConv').textContent=formatBytes(conv);
      $('sumSaved').textContent=(orig>0?((orig-conv)/orig*100).toFixed(1):0)+'%';
      summary.classList.add('show');
    }

    function updateBadge(idx,status,text){
      const b=$('badge-'+idx); if(!b) return;
      b.className='badge badge-'+status; b.textContent=text;
    }

    async function convertImage(file,format,quality,mode,targetW,targetH,scale){
      return new Promise((resolve,reject)=>{
        const img=new Image();
        img.onload=()=>{
          let w=img.width, h=img.height;
          if(mode==='fit' && targetW && targetH){ const r=Math.min(targetW/w,targetH/h); w=Math.round(w*r); h=Math.round(h*r); }
          else if(mode==='exact' && targetW && targetH){ w=targetW; h=targetH; }
          else if(mode==='scale'){ w=Math.round(w*scale); h=Math.round(h*scale); }
          const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
          const ctx=canvas.getContext('2d');
          if(format==='image/jpeg'){ ctx.fillStyle=$('bgColor').value; ctx.fillRect(0,0,w,h); }
          ctx.drawImage(img,0,0,w,h);
          canvas.toBlob(blob => {
            if(blob && blob.type===format) return resolve(blob);
            // fallback if requested type unsupported
            canvas.toBlob(b2 => b2?resolve(b2):reject(new Error('Conversion failed')), 'image/webp', quality);
          }, format, quality);
        };
        img.onerror=()=>reject(new Error('Failed to load image'));
        img.src=URL.createObjectURL(file);
      });
    }

    function downloadBlob(blob,name){ const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=name; a.click(); URL.revokeObjectURL(url); }
    // FIX: strip the real extension (was /\.+$/ which only removed trailing dots).
    function outName(originalName){ const base=originalName.replace(/\.[^.]+$/,''); return ($('prefix').value||'')+base+($('suffix').value||'')+'.'+targetExt(); }

    /* SECURE: preview tiles built via DOM nodes; blob URL set as a property. */
    function addPreviewImage(idx,blob,originalName){
      const url=URL.createObjectURL(blob);
      const c=document.createElement('div'); c.className='preview-item';
      const img=document.createElement('img'); img.src=url; img.alt='converted';
      const tag=document.createElement('span'); tag.className='size-tag'; tag.textContent=formatBytes(blob.size);
      const dl=document.createElement('button'); dl.className='dl'; dl.title='Download';
      const di=document.createElement('i'); di.className='fa-solid fa-download'; dl.appendChild(di);
      dl.addEventListener('click', () => downloadBlob(blob, outName(originalName)));
      c.appendChild(img); c.appendChild(tag); c.appendChild(dl);
      resultPreview.appendChild(c);
    }

    /* ZIP */
    downloadZipBtn.addEventListener('click', async () => {
      if(!convertedResults.length) return;
      const zip=new JSZip();
      convertedResults.forEach(r => zip.file(outName(r.name), r.blob));
      const content=await zip.generateAsync({ type:'blob', compression:'DEFLATE' });
      downloadBlob(content, 'imgpdftools-converted.zip');
      toast('ZIP downloaded');
    });

    /* History */
    function saveHistory(count,format,quality){
      let h;
      try { h=JSON.parse(localStorage.getItem('convertHistory')||'[]'); } catch(e){ h=[]; }
      if(!Array.isArray(h)) h=[];
      h.push({ date:new Date().toISOString(), count, format, quality });
      if(h.length>10) h.shift();
      localStorage.setItem('convertHistory', JSON.stringify(h));
    }
    /* SECURE: history entries (read from localStorage, which other scripts can
       tamper with) are rebuilt as DOM nodes via textContent with defensive
       parsing — no innerHTML, so stored data can never inject markup. */
    $('historyBtn').addEventListener('click', () => {
      const panel=$('historyPanel');
      let h;
      try { h=JSON.parse(localStorage.getItem('convertHistory')||'[]'); } catch(e){ h=[]; }
      if(!Array.isArray(h)) h=[];
      panel.textContent='';
      if(!h.length){
        const d=document.createElement('div'); d.textContent='No conversion history yet.'; panel.appendChild(d);
      } else {
        h.slice(-5).reverse().forEach(x=>{
          const d=document.createElement('div');
          const fmt=(typeof x.format==='string' && x.format.includes('/')) ? x.format.split('/')[1].toUpperCase() : 'IMG';
          const q=Math.round((parseFloat(x.quality)||0)*100);
          const cnt=parseInt(x.count)||0;
          const date=x.date ? new Date(x.date).toLocaleString() : '';
          d.textContent=`${date} — ${cnt} files → ${fmt} @ ${q}%`;
          panel.appendChild(d);
        });
      }
      panel.classList.toggle('show');
    });

    function formatBytes(bytes){ if(!bytes) return '0 B'; const k=1024, s=['B','KB','MB']; const i=Math.floor(Math.log(bytes)/Math.log(k)); return parseFloat((bytes/Math.pow(k,i)).toFixed(1))+' '+s[i]; }

    /* Init */
    syncFormatUI();
  })();
  </script>
</body>
</html>
