<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unit Converter – PixelPress</title>
  <meta name="description" content="Convert length, area, volume, weight, temperature, speed, time, and digital data instantly. Free online unit converter with history and favorites.">
  <link rel="canonical" href="https://pixelpress-smoky.vercel.app/unit-converter.html">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
    :root {
      --bg: #f5f5f7; --surface: rgba(255,255,255,0.75); --card: #ffffff;
      --border: rgba(0,0,0,0.06); --text: #1d1d1f; --muted: #6e6e73;
      --accent: #ec4899; --accent2: #a78bfa; --glow: rgba(236,72,153,0.1); --r: 16px;
    }
    [data-theme="dark"] {
      --bg: #09090e; --surface: rgba(21,21,30,0.7); --card: #15151e;
      --border: rgba(255,255,255,0.08); --text: #e8e8f0; --muted: #86868b;
      --glow: rgba(236,72,153,0.25);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; min-height:100vh; display:flex; flex-direction:column; transition:0.3s; }
    
    /* NAV */
    nav { position:sticky; top:0; z-index:200; display:flex; align-items:center; justify-content:space-between; padding:0 clamp(1rem,5vw,3rem); height:64px; background:var(--surface); backdrop-filter:blur(20px); border-bottom:1px solid var(--border); }
    .nav-left { display:flex; align-items:center; gap:1rem; }
    .back-btn { background:var(--card); border:1px solid var(--border); width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--text); font-size:1.1rem; cursor:pointer; text-decoration:none; transition:0.2s; }
    .back-btn:hover { border-color:var(--accent); transform:scale(1.05); }
    .nav-logo { font-family:'Syne',sans-serif; font-weight:800; font-size:1.25rem; text-transform:uppercase; text-decoration:none; color:inherit; }
    .nav-logo span { background:linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }

    /* MAIN LAYOUT */
    .main { flex:1; max-width:900px; margin:0 auto; width:100%; padding:1.5rem 16px 4rem; display:grid; grid-template-columns:1fr 260px; gap:1.5rem; }
    @media(max-width:750px) { .main { grid-template-columns:1fr; } }

    /* LEFT PANEL */
    .left-panel { display:flex; flex-direction:column; gap:1.5rem; }

    /* TABS - Horizontal scroll on mobile */
    .tabs-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; padding-bottom:4px; }
    .tabs-wrap::-webkit-scrollbar { display:none; }
    .tabs { display:flex; gap:6px; }
    .tab { padding:8px 16px; border-radius:999px; background:var(--card); border:1px solid var(--border); cursor:pointer; font-weight:600; font-size:0.8rem; white-space:nowrap; transition:0.2s; color:var(--muted); flex-shrink:0; }
    .tab:hover { border-color:var(--accent); color:var(--text); }
    .tab.active { background:var(--accent); color:white; border-color:var(--accent); }

    /* CONVERTER CARD */
    .card { background:var(--card); border:1px solid var(--border); border-radius:var(--r); padding:1.2rem; }
    .converter { display:flex; align-items:center; gap:12px; }
    @media(max-width:500px) { .converter { flex-direction:column; } }
    .input-group { flex:1; }
    .input-group label { display:block; font-size:0.7rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:4px; }
    .input-group input { width:100%; padding:12px 14px; border:2px solid var(--border); border-radius:10px; background:var(--bg); color:var(--text); font-size:1.3rem; font-weight:600; outline:none; transition:0.2s; }
    .input-group input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--glow); }
    .input-group select { width:100%; padding:8px 10px; margin-top:6px; border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text); font-size:0.85rem; cursor:pointer; }
    .swap-btn { width:44px; height:44px; border-radius:50%; background:var(--accent); color:white; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:1.1rem; transition:0.3s; flex-shrink:0; }
    .swap-btn:hover { transform:rotate(180deg) scale(1.1); }
    @media(max-width:500px) { .swap-btn { transform:rotate(90deg); } .swap-btn:hover { transform:rotate(270deg) scale(1.1); } }
    .rate { text-align:center; font-size:0.8rem; color:var(--muted); margin-top:10px; padding:6px 12px; background:var(--bg); border-radius:8px; font-family:'JetBrains Mono',monospace; display:inline-block; }

    /* ACTIONS */
    .actions { display:flex; gap:8px; flex-wrap:wrap; }
    .btn { padding:8px 16px; border-radius:8px; border:1px solid var(--border); background:var(--card); color:var(--text); font-weight:600; cursor:pointer; font-size:0.85rem; transition:0.2s; display:inline-flex; align-items:center; gap:6px; }
    .btn:hover { border-color:var(--accent); }
    .btn-accent { background:var(--accent); color:white; border:none; }
    .btn-accent:hover { background:var(--accent2); }

    /* HISTORY & FAVORITES */
    .list-item { display:flex; justify-content:space-between; align-items:center; padding:8px 10px; background:var(--bg); border-radius:8px; margin-bottom:4px; font-size:0.85rem; }
    .list-item span { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .list-item i { cursor:pointer; color:var(--muted); flex-shrink:0; margin-left:8px; transition:0.2s; }
    .list-item i:hover { color:var(--accent); }

    /* RIGHT PANEL - Sticky TOC */
    .right-panel { display:flex; flex-direction:column; gap:1rem; }
    .toc-card { background:var(--card); border:1px solid var(--border); border-radius:var(--r); padding:1rem; position:sticky; top:80px; }
    .toc-card h3 { font-family:'Syne',sans-serif; font-size:0.9rem; margin-bottom:0.8rem; display:flex; align-items:center; gap:6px; }
    .toc-list { display:flex; flex-direction:column; gap:3px; }
    .toc-link { padding:8px 10px; border-radius:8px; cursor:pointer; font-size:0.8rem; color:var(--muted); transition:0.15s; border:1px solid transparent; }
    .toc-link:hover { background:var(--bg); color:var(--text); border-color:var(--border); }
    .toc-link.active { background:var(--glow); color:var(--accent); border-color:var(--accent); font-weight:600; }
    @media(max-width:750px) {
      .right-panel { order:-1; }
      .toc-card { position:static; }
      .toc-list { flex-direction:row; flex-wrap:wrap; gap:4px; }
      .toc-link { font-size:0.72rem; padding:6px 10px; white-space:nowrap; }
    }

    .empty-text { color:var(--muted); font-size:0.85rem; padding:0.5rem 0; }
    footer { text-align:center; padding:2rem; color:var(--muted); font-size:0.85rem; border-top:1px solid var(--border); margin-top:auto; }
  </style>
</head>
<body>
  <nav>
    <div class="nav-left">
      <a href="./index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
      <a href="./index.html" class="nav-logo">PIXEL<span>PRESS</span></a>
    </div>
    <button id="themeToggle" class="back-btn">🌓</button>
  </nav>

  <div class="main">
    <!-- LEFT PANEL -->
    <div class="left-panel">
      <!-- Tabs -->
      <div class="tabs-wrap">
        <div class="tabs" id="tabs">
          <button class="tab active" data-cat="length">Length</button>
          <button class="tab" data-cat="area">Area</button>
          <button class="tab" data-cat="volume">Volume</button>
          <button class="tab" data-cat="weight">Weight</button>
          <button class="tab" data-cat="temp">Temperature</button>
          <button class="tab" data-cat="speed">Speed</button>
          <button class="tab" data-cat="time">Time</button>
          <button class="tab" data-cat="digital">Digital</button>
        </div>
      </div>

      <!-- Converter -->
      <div class="card">
        <div class="converter">
          <div class="input-group">
            <label>From</label>
            <input type="number" id="inputVal" value="1" step="any" />
            <select id="inputUnit"></select>
          </div>
          <button class="swap-btn" id="swapBtn"><i class="fa-solid fa-right-left"></i></button>
          <div class="input-group">
            <label>To</label>
            <input type="text" id="outputVal" readonly />
            <select id="outputUnit"></select>
          </div>
        </div>
        <div style="text-align:center;"><span class="rate" id="rateDisplay"></span></div>
      </div>

      <!-- Actions -->
      <div class="actions">
        <button class="btn" id="copyBtn"><i class="fa-solid fa-copy"></i> Copy</button>
        <button class="btn btn-accent" id="favBtn"><i class="fa-regular fa-heart"></i> Favourite</button>
        <button class="btn" id="clearHistoryBtn"><i class="fa-solid fa-trash"></i> Clear History</button>
      </div>

      <!-- History & Favorites -->
      <div class="card">
        <h3 style="font-family:'Syne',sans-serif;font-size:0.95rem;margin-bottom:0.8rem;"><i class="fa-solid fa-clock-rotate-left"></i> Recent</h3>
        <div id="history"><p class="empty-text">No history</p></div>
      </div>
      <div class="card">
        <h3 style="font-family:'Syne',sans-serif;font-size:0.95rem;margin-bottom:0.8rem;"><i class="fa-solid fa-heart"></i> Favorites</h3>
        <div id="favorites"><p class="empty-text">No favorites</p></div>
      </div>
    </div>

    <!-- RIGHT PANEL - Sticky TOC -->
    <div class="right-panel">
      <div class="toc-card">
        <h3><i class="fa-solid fa-list"></i> Categories</h3>
        <div class="toc-list" id="tocList"></div>
      </div>
    </div>
  </div>

  <footer>© 2026 PixelPress – Unit Converter</footer>

  <script>
    (function() {
      function syncTheme() {
        const saved = localStorage.getItem('pixelpress-theme');
        const theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      }
      document.getElementById('themeToggle').addEventListener('click', () => {
        const curr = document.documentElement.getAttribute('data-theme');
        const next = curr === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('pixelpress-theme', next);
      });
      syncTheme();

      const unitsDB = {
        length: { meters:1, kilometers:0.001, centimeters:100, millimeters:1000, miles:0.000621371, yards:1.09361, feet:3.28084, inches:39.3701 },
        area: { sqmeters:1, sqkilometers:1e-6, sqcentimeters:10000, sqmiles:3.861e-7, acres:0.000247105, hectares:0.0001 },
        volume: { liters:1, milliliters:1000, cubicmeters:0.001, gallons:0.264172, quarts:1.05669, pints:2.11338, cups:4.22675 },
        weight: { kilograms:1, grams:1000, milligrams:1e6, pounds:2.20462, ounces:35.274, tons:0.001 },
        temp: { celsius:'C', fahrenheit:'F', kelvin:'K' },
        speed: { mps:1, kmph:3.6, mph:2.23694, knots:1.94384 },
        time: { seconds:1, minutes:1/60, hours:1/3600, days:1/86400, weeks:1/604800 },
        digital: { bytes:1, kilobytes:1/1024, megabytes:1/1048576, gigabytes:1/1073741824, terabytes:1/1099511627776 }
      };

      let currentCat = 'length';
      const inputVal = document.getElementById('inputVal');
      const outputVal = document.getElementById('outputVal');
      const inputUnit = document.getElementById('inputUnit');
      const outputUnit = document.getElementById('outputUnit');
      const rateDisplay = document.getElementById('rateDisplay');

      function buildTOC() {
        const toc = document.getElementById('tocList');
        toc.innerHTML = Object.keys(unitsDB).map(cat => 
          `<div class="toc-link ${cat===currentCat?'active':''}" data-cat="${cat}">${cat.charAt(0).toUpperCase()+cat.slice(1)}</div>`
        ).join('');
        toc.querySelectorAll('.toc-link').forEach(link => {
          link.addEventListener('click', () => switchCat(link.dataset.cat));
        });
      }

      function switchCat(cat) {
        currentCat = cat;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelector(`[data-cat="${cat}"]`)?.classList.add('active');
        document.querySelectorAll('.toc-link').forEach(l => l.classList.remove('active'));
        document.querySelector(`.toc-link[data-cat="${cat}"]`)?.classList.add('active');
        populateUnits();
      }

      function populateUnits() {
        inputUnit.innerHTML = ''; outputUnit.innerHTML = '';
        Object.keys(unitsDB[currentCat]).forEach(u => {
          const opt = `<option value="${u}">${u.charAt(0).toUpperCase()+u.slice(1)}</option>`;
          inputUnit.innerHTML += opt; outputUnit.innerHTML += opt;
        });
        if (outputUnit.options.length > 1) outputUnit.selectedIndex = 1;
        convert();
      }

      function convertTemp(v,f,t) {
        if(f===t) return v;
        let c = v;
        if(f==='fahrenheit') c=(v-32)*5/9;
        else if(f==='kelvin') c=v-273.15;
        if(t==='celsius') return c;
        if(t==='fahrenheit') return c*9/5+32;
        return c+273.15;
      }

      function convert() {
        const v = parseFloat(inputVal.value);
        if(isNaN(v)) { outputVal.value=''; rateDisplay.textContent=''; return; }
        const from=inputUnit.value, to=outputUnit.value;
        let result;
        if(currentCat==='temp') { result=convertTemp(v,from,to); rateDisplay.textContent=''; }
        else {
          result = (v/unitsDB[currentCat][from])*unitsDB[currentCat][to];
          const rate = unitsDB[currentCat][to]/unitsDB[currentCat][from];
          rateDisplay.textContent = `1 ${from} = ${rate.toPrecision(6)} ${to}`;
        }
        outputVal.value = Number.isInteger(result)?result:parseFloat(result.toFixed(8));
        addHistory(v,from,to,result);
      }

      function addHistory(v,f,t,r) {
        const h=JSON.parse(localStorage.getItem('unitHistory')||'[]');
        h.unshift({v,f,t,r,cat:currentCat,time:new Date().toISOString()});
        if(h.length>20) h.pop();
        localStorage.setItem('unitHistory',JSON.stringify(h));
        renderHistory();
      }

      function renderHistory() {
        const div=document.getElementById('history');
        const h=JSON.parse(localStorage.getItem('unitHistory')||'[]');
        if(!h.length){ div.innerHTML='<p class="empty-text">No history</p>'; return; }
        div.innerHTML=h.slice(0,5).map((x,i)=>`
          <div class="list-item"><span>${x.v} ${x.f} → ${x.r} ${x.t}</span><i class="fa-solid fa-arrow-up-right-from-square" onclick="loadHist(${i})"></i></div>
        `).join('');
      }
      window.loadHist=(i)=>{
        const h=JSON.parse(localStorage.getItem('unitHistory')||'[]');
        if(i<h.length){ const x=h[i]; switchCat(x.cat); populateUnits(); inputVal.value=x.v; inputUnit.value=x.f; outputUnit.value=x.t; convert(); }
      };

      function addFav(){
        const f=JSON.parse(localStorage.getItem('unitFavs')||'[]');
        const p={cat:currentCat,from:inputUnit.value,to:outputUnit.value};
        if(!f.some(x=>x.cat===p.cat&&x.from===p.from&&x.to===p.to)){ f.push(p); localStorage.setItem('unitFavs',JSON.stringify(f)); renderFavs(); }
      }
      function renderFavs(){
        const div=document.getElementById('favorites');
        const f=JSON.parse(localStorage.getItem('unitFavs')||'[]');
        if(!f.length){ div.innerHTML='<p class="empty-text">No favorites</p>'; return; }
        div.innerHTML=f.map((x,i)=>`
          <div class="list-item"><span>${x.from} → ${x.to} (${x.cat})</span><i class="fa-solid fa-xmark" onclick="delFav(${i})"></i></div>
        `).join('');
      }
      window.delFav=(i)=>{ const f=JSON.parse(localStorage.getItem('unitFavs')||'[]'); f.splice(i,1); localStorage.setItem('unitFavs',JSON.stringify(f)); renderFavs(); };

      document.getElementById('swapBtn').addEventListener('click',()=>{ const t=inputUnit.value; inputUnit.value=outputUnit.value; outputUnit.value=t; convert(); });
      document.getElementById('copyBtn').addEventListener('click',()=>{ navigator.clipboard.writeText(outputVal.value).then(()=>alert('Copied!')); });
      document.getElementById('favBtn').addEventListener('click',addFav);
      document.getElementById('clearHistoryBtn').addEventListener('click',()=>{ localStorage.removeItem('unitHistory'); renderHistory(); });

      document.querySelectorAll('.tab').forEach(tab => { tab.addEventListener('click',(e)=>switchCat(e.target.dataset.cat)); });
      inputVal.addEventListener('input',convert);
      inputUnit.addEventListener('change',convert);
      outputUnit.addEventListener('change',convert);

      buildTOC();
      populateUnits();
      renderHistory();
      renderFavs();
    })();
  </script>
</body>
</html>
