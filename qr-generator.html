  <style>
    :root {
      --bg:#f8f8fc; --surface:rgba(255,255,255,0.90); --card:#ffffff;
      --border:rgba(0,0,0,0.06); --text:#18181b; --muted:#71717a;
      --accent:#6366f1; --accent2:#8b5cf6; --accent3:#06b6d4; --glow:rgba(99,102,241,0.14);
      --r:18px; --fhead:'Space Grotesk',sans-serif; --fbody:'Plus Jakarta Sans',system-ui,sans-serif; --fmono:'JetBrains Mono',ui-monospace,monospace;
    }
    [data-theme="dark"] {
      --bg:#0c0c14; --surface:rgba(18,18,30,0.92); --card:#16162a;
      --border:rgba(255,255,255,0.08); --text:#e4e4f0; --muted:#8888aa; --glow:rgba(99,102,241,0.28);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--bg); color:var(--text); font-family:var(--fbody); min-height:100vh; display:flex; flex-direction:column; transition:background .3s,color .3s; -webkit-font-smoothing:antialiased; }
    a { color:inherit; text-decoration:none; }

    nav { position:sticky; top:0; z-index:200; display:flex; align-items:center; justify-content:space-between; padding:0 clamp(1rem,5vw,3rem); height:66px; background:var(--surface); backdrop-filter:blur(28px) saturate(180%); -webkit-backdrop-filter:blur(28px) saturate(180%); border-bottom:1px solid var(--border); }
    .nav-left { display:flex; align-items:center; gap:1rem; }
    .back-btn { background:var(--card); border:1px solid var(--border); width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--text); font-size:1rem; cursor:pointer; transition:transform .2s,border-color .2s,box-shadow .2s; text-decoration:none; }
    .back-btn:hover { border-color:var(--accent); transform:scale(1.08); box-shadow:0 0 0 3px var(--glow); }
    .nav-logo { display:flex; align-items:center; gap:8px; font-family:var(--fhead); font-weight:700; font-size:1.15rem; letter-spacing:-.3px; }
    .logo-icon { width:32px; height:32px; background:linear-gradient(135deg,var(--accent),var(--accent2)); border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:16px; box-shadow:0 4px 14px var(--glow); }
    .logo-text-img { color:var(--text); }
    .logo-text-pdf { background:linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .logo-text-tools { color:var(--muted); font-weight:600; }

    .main { flex:1; max-width:1200px; margin:0 auto; width:100%; padding:2rem 20px 4rem; display:grid; grid-template-columns:1fr 380px; gap:2rem; }
    @media (max-width:900px) { .main { grid-template-columns:1fr; } }
    .preview-panel { display:flex; flex-direction:column; align-items:center; gap:1.5rem; }
    .preview-card { background:var(--card); border:1.5px solid var(--border); border-radius:var(--r); padding:2rem; display:flex; justify-content:center; align-items:center; box-shadow:0 8px 30px rgba(0,0,0,0.03); width:100%; }
    #qrContainer { width:280px; height:280px; }
    .design-panel { background:var(--card); border:1.5px solid var(--border); border-radius:var(--r); padding:1.5rem; overflow-y:auto; max-height:calc(100vh - 120px); box-shadow:0 4px 20px rgba(0,0,0,0.02); }
    .section-title { font-family:var(--fhead); font-size:1.1rem; font-weight:700; margin:1.2rem 0 0.8rem; display:flex; align-items:center; gap:8px; }
    .tab-row { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:1rem; }
    .tab { padding:8px 16px; border-radius:999px; background:var(--bg); border:1px solid var(--border); cursor:pointer; font-weight:600; transition:all 0.2s; font-size:13px; color:var(--text); }
    .tab.active { background:var(--accent); color:white; border-color:var(--accent); }
    .input-group { margin-bottom:1rem; }
    label { display:block; margin-bottom:4px; font-weight:600; font-size:0.85rem; color:var(--muted); }
    input, textarea, select { width:100%; padding:10px 12px; border:1.5px solid var(--border); border-radius:10px; background:var(--bg); color:var(--text); font-size:14px; font-family:inherit; }
    input:focus, textarea:focus, select:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--glow); outline:none; }
    textarea { min-height:70px; font-family:var(--fmono); }
    .color-row { display:flex; align-items:center; gap:8px; }
    .color-row input[type="color"] { width:40px; height:40px; padding:2px; border-radius:8px; border:1px solid var(--border); }
    .range-row { display:flex; align-items:center; gap:10px; }
    .range-row input[type="range"] { flex:1; accent-color:var(--accent); }
    .range-row span { min-width:30px; }
    .switch-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem; }
    .switch-row label { margin:0; font-size:.85rem; color:var(--text); font-weight:600; }
    .switch { position:relative; width:42px; height:23px; flex-shrink:0; }
    .switch input { opacity:0; width:0; height:0; }
    .switch .tog { position:absolute; inset:0; background:#c4c4d8; border-radius:99px; cursor:pointer; transition:.3s; }
    [data-theme="dark"] .switch .tog { background:#2a2a42; }
    .switch .tog::before { content:''; position:absolute; width:17px; height:17px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.3s; }
    .switch input:checked + .tog { background:var(--accent); }
    .switch input:checked + .tog::before { transform:translateX(19px); }
    .btn-group { display:flex; gap:8px; flex-wrap:wrap; margin-top:1rem; }
    button { padding:10px 18px; border:none; border-radius:10px; font-weight:700; cursor:pointer; transition:all 0.2s; font-size:13px; display:flex; align-items:center; gap:6px; font-family:var(--fbody); }
    .btn-primary { background:var(--accent); color:white; box-shadow:0 4px 14px var(--glow); }
    .btn-primary:hover { background:var(--accent2); }
    .btn-secondary { background:var(--bg); color:var(--text); border:1px solid var(--border); }
    .btn-secondary:hover { border-color:var(--accent); color:var(--accent); }
    .note { font-size:0.8rem; color:var(--muted); margin-top:6px; }
    .badge { background:var(--accent); color:white; border-radius:20px; padding:2px 10px; font-size:11px; margin-left:6px; }
    footer { text-align:center; padding:30px 20px; color:var(--muted); font-size:0.9rem; border-top:1px solid var(--border); background:var(--card); margin-top:auto; }
    .footer-logo { display:inline-flex; align-items:center; gap:7px; margin-bottom:10px; font-family:var(--fhead); font-weight:700; font-size:1rem; }

    #toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--text); color:var(--bg); padding:11px 20px; border-radius:99px; font-size:13px; font-weight:600; opacity:0; pointer-events:none; transition:opacity .3s,transform .3s; z-index:999; box-shadow:0 8px 24px rgba(0,0,0,.2); }
    #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  </style>
</head>

  <div class="main">

      <div class="tool-header" style="text-align:center;">
        <h1 style="font-family:var(--fhead); font-size:1.8rem; font-weight:700; background:linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">QR Code Pro</h1>

    <!-- Design Panel -->
    <div class="design-panel">
      <div class="section-title"><i class="fa-solid fa-pen"></i> Content Type</div>
      <div class="tab-row" id="contentTabs">
        <div class="tab active" data-mode="url">URL</div>

        <div class="tab" data-mode="email">Email</div>
        <div class="tab" data-mode="sms">SMS</div>

        <div class="tab" data-mode="batch">Batch <span class="badge">Pro</span></div>

      <div class="input-group">

      <div class="input-group">
        <label>Background Color</label>

          <option value="L">L (7%)</option>

        <select id="exportSize">
          <option value="256">256 × 256 px</option>

          <option value="1024">1024 × 1024 px</option>

  <div id="toast"></div>

  <script>
    let toastTimer;
    function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2000); }

    let qrCode = null;
    const qrContainer = document.getElementById('qrContainer');
    const DEFAULT_DATA = "https://imgpdftools.xyz";

    const defaultOptions = {
      width: 280, height: 280, type: "canvas", data: DEFAULT_DATA, image: "", margin: 10,
      qrOptions: { typeNumber: "0", mode: "Byte", errorCorrectionLevel: "H" },
      imageOptions: { hideBackgroundDots: true, imageSize: 0.4, margin: 10, crossOrigin: "anonymous" },
      dotsOptions: { color: "#000000", gradient: { type: "linear", rotation: 0, colorStops: [ { offset: 0, color: "#000000" }, { offset: 1, color: "#6366f1" } ] }, type: "dots" },
      cornersSquareOptions: { type: "extra-rounded", color: "#000000" },
      backgroundOptions: { color: "#ffffff" },
    };

    function initQR() { qrCode = new QRCodeStyling({ ...defaultOptions }); qrCode.append(qrContainer); }

    // Build a fresh options object from current UI state (used for preview + export)
    function getCurrentOptions(size) {
      const dotStyle = document.getElementById('dotStyle').value;
      const cornerStyle = document.getElementById('cornerStyle').value;
      const color1 = document.getElementById('color1').value;
      const color2 = document.getElementById('color2').value;
      const transparent = document.getElementById('transparentBg').checked;
      const bgColor = transparent ? 'rgba(0,0,0,0)' : document.getElementById('bgColor').value;
      const ec = document.getElementById('ecLevel').value;
      const margin = parseInt(document.getElementById('margin').value);
      const opts = {
        margin: margin,
        qrOptions: { errorCorrectionLevel: ec },
        dotsOptions: { type: dotStyle, gradient: { type: "linear", rotation: 0, colorStops: [ { offset: 0, color: color1 }, { offset: 1, color: color2 } ] } },
        cornersSquareOptions: { type: cornerStyle, color: color1 },
        backgroundOptions: { color: bgColor },
        image: qrCode?._options?.image || "",
        imageOptions: { hideBackgroundDots: true, imageSize: 0.4, margin: 10 }
      };
      if (size) { opts.width = size; opts.height = size; }
      return opts;
    }

    function updateQR() {
      if (!qrCode) return;
      const mode = document.querySelector('#contentTabs .tab.active')?.dataset.mode || 'url';
      const content = buildContent(mode);
      if (!content || typeof content !== 'string') return;
      qrCode.update({ data: content, ...getCurrentOptions() });
    }

    // ---- Content Builder ----
    function buildContent(mode) {
      switch(mode) {
        case 'url': return document.getElementById('urlText')?.value.trim() || DEFAULT_DATA;
        case 'wifi': {
          const ssid = document.getElementById('ssid')?.value.trim() || 'MyWiFi';
          const pass = document.getElementById('wifiPass')?.value.trim() || '';
          const enc = document.getElementById('wifiEnc')?.value || 'WPA';
          return `WIFI:S:${ssid};T:${enc};P:${pass};;`;
        }
        case 'vcard': {
          const name = document.getElementById('vName')?.value.trim() || 'Ahmed Ali';
          const phone = document.getElementById('vPhone')?.value.trim() || '';
          const email = document.getElementById('vEmail')?.value.trim() || '';
          let vcf = `BEGIN:VCARD\nVERSION:3.0\nFN:${name}`;
          if(phone) vcf += `\nTEL:${phone}`;
          if(email) vcf += `\nEMAIL:${email}`;
          vcf += '\nEND:VCARD';
          return vcf;
        }
        case 'email': {
          const to = document.getElementById('emailTo')?.value.trim() || '';
          const sub = document.getElementById('emailSub')?.value.trim() || '';
          const body = document.getElementById('emailBody')?.value.trim() || '';
          return `MATMSG:TO:${to};SUB:${sub};BODY:${body};;`;
        }
        case 'sms': {
          const num = document.getElementById('smsNum')?.value.trim() || '';
          const msg = document.getElementById('smsMsg')?.value.trim() || '';
          return `SMSTO:${num}:${msg}`;
        }
        case 'image': {
          const file = document.getElementById('imageUpload')?.files[0];
          if (!file) { toast('Please select an image.'); return ''; }
          return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = e => resolve(e.target.result);
            reader.onerror = reject;
            reader.readAsDataURL(file);
          });
        }
        case 'batch': return '';
        default: return '';
      }
    }

    // ---- Dynamic Inputs based on mode ----
    function renderInputFields(mode) {
      const area = document.getElementById('dynamicInputs');
      area.innerHTML = '';
      let html = '';
      switch(mode) {
        case 'url':
          html = `<div class="input-group"><label>URL or Text</label><textarea id="urlText" placeholder="https://...">${DEFAULT_DATA}</textarea></div>`;
          break;
        case 'wifi':
          html = `<div class="input-group"><label>SSID</label><input id="ssid" value="MyWiFi"></div>
                  <div class="input-group"><label>Password</label><input id="wifiPass" value="password123"></div>
                  <div class="input-group"><label>Encryption</label><select id="wifiEnc"><option value="WPA" selected>WPA/WPA2</option><option value="WEP">WEP</option><option value="nopass">None</option></select></div>`;
          break;
        case 'vcard':
          html = `<div class="input-group"><label>Name</label><input id="vName" value="Ahmed Ali"></div>
                  <div class="input-group"><label>Phone</label><input id="vPhone" value="+966501234567"></div>
                  <div class="input-group"><label>Email</label><input id="vEmail" value=""></div>`;
          break;
        case 'email':
          html = `<div class="input-group"><label>To</label><input id="emailTo" value="hello@example.com"></div>
                  <div class="input-group"><label>Subject</label><input id="emailSub" value="Hello"></div>
                  <div class="input-group"><label>Body</label><textarea id="emailBody"></textarea></div>`;
          break;
        case 'sms':
          html = `<div class="input-group"><label>Phone</label><input id="smsNum" value="+966501234567"></div>
                  <div class="input-group"><label>Message</label><textarea id="smsMsg"></textarea></div>`;
          break;
        case 'image':
          html = `<div class="input-group"><label>Select image (small)</label><input type="file" id="imageUpload" accept="image/*"><div class="note">Will be encoded as data URL (very small images only)</div></div>`;
          break;
        case 'batch':
          html = `<div class="input-group"><label>Enter multiple URLs/texts (one per line)</label><textarea id="batchInput" placeholder="https://example.com&#10;https://another.com&#10;Hello World"></textarea></div>
                  <button onclick="generateBatch()" class="btn-primary" style="width:100%;justify-content:center;"><i class="fa-solid fa-layer-group"></i> Generate Batch</button>
                  <div id="batchProgress" class="note"></div>`;
          break;
      }
      area.innerHTML = html;

      area.querySelectorAll('input, textarea, select').forEach(el => {
        el.addEventListener('input', () => { if (mode !== 'batch') updateQR(); });
      });
      if (mode === 'image') {
        document.getElementById('imageUpload')?.addEventListener('change', () => {
          const file = document.getElementById('imageUpload').files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = (e) => { if (qrCode) qrCode.update({ data: e.target.result }); };
            reader.readAsDataURL(file);
          }
        });
      }
      if (mode !== 'batch') updateQR();
    }

    // ---- Tab switching ----
    document.querySelectorAll('#contentTabs .tab').forEach(tab => {
      tab.addEventListener('click', function() {
        document.querySelectorAll('#contentTabs .tab').forEach(t => t.classList.remove('active'));
        this.classList.add('active');
        renderInputFields(this.dataset.mode);
      });
    });

    // ---- Style change listeners ----
    document.getElementById('dotStyle').addEventListener('change', updateQR);
    document.getElementById('cornerStyle').addEventListener('change', updateQR);
    document.getElementById('color1').addEventListener('input', function() { document.getElementById('color1Hex').textContent = this.value; updateQR(); });
    document.getElementById('color2').addEventListener('input', function() { document.getElementById('color2Hex').textContent = this.value; updateQR(); });
    document.getElementById('bgColor').addEventListener('input', updateQR);
    document.getElementById('transparentBg').addEventListener('change', updateQR);
    document.getElementById('margin').addEventListener('input', function() { document.getElementById('marginVal').textContent = this.value; updateQR(); });
    document.getElementById('ecLevel').addEventListener('change', updateQR);

    // Logo upload
    document.getElementById('logoUpload').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => { if (qrCode) qrCode.update({ image: ev.target.result }); toast('Logo added'); };
      reader.readAsDataURL(file);
    });

    // ---- Download (high-res via temp instance) ----
    function downloadQR(format) {
      if (!qrCode) return;
      const mode = document.querySelector('#contentTabs .tab.active')?.dataset.mode || 'url';
      const content = buildContent(mode);
      const size = parseInt(document.getElementById('exportSize').value);
      const ext = format === 'jpeg' ? 'jpg' : format;
      const doDownload = (data) => {
        const exportOpts = { ...defaultOptions, data: data || DEFAULT_DATA, ...getCurrentOptions(size) };
        // JPEG can't be transparent — force white bg
        if (format === 'jpeg' && document.getElementById('transparentBg').checked) {
          exportOpts.backgroundOptions = { color: '#ffffff' };
        }
        const temp = new QRCodeStyling(exportOpts);
        temp.download({ name: `qr-${Date.now()}`, extension: ext });
        toast(`Exported ${ext.toUpperCase()} @ ${size}px`);
      };
      if (content instanceof Promise) { content.then(doDownload); } else { doDownload(content); }
    }

    // ---- Presets Save/Load ----
    function savePreset() {
      const preset = {
        dotStyle: document.getElementById('dotStyle').value,
        cornerStyle: document.getElementById('cornerStyle').value,
        color1: document.getElementById('color1').value,
        color2: document.getElementById('color2').value,
        bgColor: document.getElementById('bgColor').value,
        transparentBg: document.getElementById('transparentBg').checked,
        margin: document.getElementById('margin').value,
        ecLevel: document.getElementById('ecLevel').value,
        exportSize: document.getElementById('exportSize').value,
      };
      localStorage.setItem('imgpdftools-qr-preset', JSON.stringify(preset));
      toast('Design saved');
    }
