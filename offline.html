<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Offline — ImgPDFTools</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#6366f1" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self';" />
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<style>
  :root {
    --bg:#f8f8fc; --card:#ffffff; --text:#18181b; --muted:#71717a;
    --accent:#6366f1; --accent2:#8b5cf6; --border:rgba(0,0,0,0.08);
    --green:#10b981; --red:#ef4444;
  }
  [data-theme="dark"] {
    --bg:#0c0c14; --card:#16162a; --text:#e4e4f0; --muted:#8888aa; --border:rgba(255,255,255,0.08);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh; background:var(--bg); color:var(--text); text-align:center; padding:1.5rem;
    transition:background .3s, color .3s;
  }
  .logo-icon {
    width:66px; height:66px; border-radius:18px;
    background:linear-gradient(135deg, var(--accent), var(--accent2));
    display:flex; align-items:center; justify-content:center; font-size:32px;
    margin-bottom:1.5rem; box-shadow:0 12px 30px rgba(99,102,241,0.32);
  }
  h1 { font-size:1.8rem; margin-bottom:.6rem; letter-spacing:-0.5px; }
  p { color:var(--muted); max-width:360px; line-height:1.65; font-size:.95rem; }
  .status { margin-top:1.2rem; font-size:.85rem; color:var(--muted); display:flex; align-items:center; gap:8px; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--red); box-shadow:0 0 8px var(--red); }
  .dot.online { background:var(--green); box-shadow:0 0 8px var(--green); }
  button {
    margin-top:1.6rem; padding:.75rem 1.7rem; border:none;
    background:linear-gradient(135deg, var(--accent), var(--accent2)); color:#fff;
    border-radius:11px; cursor:pointer; font-size:1rem; font-weight:600; font-family:inherit;
    transition:transform .2s, box-shadow .2s;
  }
  button:hover { transform:translateY(-2px); box-shadow:0 8px 22px rgba(99,102,241,0.38); }
  a.home { margin-top:1.1rem; color:var(--accent); font-size:.85rem; text-decoration:none; font-weight:600; }
  a.home:hover { text-decoration:underline; }
</style>
<script>
(function(){
  document.documentElement.setAttribute('data-theme',
    localStorage.getItem('imgpdftools-theme') ||
    localStorage.getItem('pixelpress-theme') ||
    (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
  );
})();
</script>
</head>
<body>
  <div class="logo-icon">🛠️</div>
  <h1>You're offline</h1>
  <p>It looks like you've lost your internet connection. Many ImgPDFTools utilities keep working offline once loaded — or reconnect to access everything.</p>
  <div class="status"><span class="dot" id="netDot"></span><span id="netText">No connection</span></div>
  <button id="retryBtn" type="button">Try Again</button>
  <a class="home" href="/index.html">Go to homepage</a>
  <script>
  (function(){
    var dot = document.getElementById('netDot');
    var txt = document.getElementById('netText');
    function update(){
      if (navigator.onLine) {
        dot.classList.add('online');
        txt.textContent = 'Back online — reloading…';
        setTimeout(function(){ location.reload(); }, 600);
      } else {
        dot.classList.remove('online');
        txt.textContent = 'No connection';
      }
    }
    document.getElementById('retryBtn').addEventListener('click', function(){ location.reload(); });
    window.addEventListener('online', update);
    window.addEventListener('offline', update);
    update();
  })();
  </script>
</body>
</html>
