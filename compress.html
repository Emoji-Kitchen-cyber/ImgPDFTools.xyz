  <style>
    @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

    :root {
      --bg: #f5f5f7;
      --surface: rgba(255,255,255,0.75);
      --card: #ffffff;
      --border: rgba(0,0,0,0.06);
      --text: #1d1d1f;
      --muted: #6e6e73;
      --accent: #ec4899;
      --accent2: #a78bfa;
      --glow: rgba(236,72,153,0.1);
      --r: 16px;
      --fhead: 'Syne', sans-serif;
      --fbody: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    [data-theme="dark"] {
      --bg: #09090e;
      --surface: rgba(21,21,30,0.7);
      --card: #15151e;
      --border: rgba(255,255,255,0.08);
      --text: #e8e8f0;
      --muted: #86868b;
      --glow: rgba(236,72,153,0.25);
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: var(--bg); color: var(--text); font-family: var(--fbody);
      min-height: 100vh; display: flex; flex-direction: column;
      transition: background 0.3s, color 0.3s;
    }

    nav {
      position: sticky; top:0; z-index:200; display: flex; align-items: center;
      justify-content: space-between; padding: 0 clamp(1rem,5vw,3rem); height:64px;
      background: var(--surface); backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .nav-left { display: flex; align-items: center; gap:1rem; }
    .back-btn {
      background: var(--card); border: 1px solid var(--border);
      width:42px; height:42px; border-radius:50%; display: flex; align-items: center;
      justify-content: center; color: var(--text); font-size:1.1rem; cursor:pointer;
      text-decoration: none; transition: all 0.2s;
    }
    .back-btn:hover { border-color: var(--accent); transform: scale(1.05); }
    .nav-logo {
      font-family: var(--fhead); font-weight:800; font-size:1.25rem;
      text-transform: uppercase; text-decoration: none; color: inherit;
    }
    .nav-logo span {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    }

    .main {
      max-width: 1100px; margin: 0 auto; width:100%; padding:2rem 20px 4rem;
      display: grid; grid-template-columns: 1fr 380px; gap:2rem;
    }
    @media (max-width: 850px) { .main { grid-template-columns:1fr; } }

    /* Upload Panel */
    .upload-panel {
      background: var(--card); border:1px solid var(--border);
      border-radius: var(--r); padding:2rem; display: flex;
      flex-direction: column; align-items: center; box-shadow:0 4px 20px rgba(0,0,0,0.02);
    }
    .upload-zone {
      border: 2px dashed var(--border); border-radius: 16px; padding:3rem;
      text-align: center; cursor:pointer; width:100%; transition:0.2s;
    }
    .upload-zone:hover { border-color: var(--accent); background: var(--glow); }
    .upload-zone i { font-size:3rem; color: var(--accent); }
    .batch-indicator { margin-top:1rem; font-size:0.85rem; color:var(--muted); }

    /* Preview Area */
    .preview-section { margin-top:1.5rem; width:100%; }
    .comparison-slider {
      position: relative; width:100%; overflow:hidden; border-radius:12px;
      background: #f0f0f0; min-height: 250px; display: flex; align-items: center; justify-content: center;
    }
    .comp-image {
      position: absolute; top:0; left:0; width:100%; height:100%; object-fit: contain;
    }
    .comp-original { z-index:1; }
    .comp-compressed { z-index:2; clip-path: inset(0 50% 0 0); }
    .slider-handle {
      position: absolute; top:0; bottom:0; width:4px; background: var(--accent);
      left:50%; cursor: ew-resize; z-index:3;
    }
    .slider-input { position: absolute; width:100%; bottom:10px; z-index:4; opacity:0.7; }

    .image-actions { display: flex; gap:10px; margin-top:1rem; flex-wrap: wrap; justify-content: center; }

    /* Settings Panel */
    .settings-panel {
      background: var(--card); border:1px solid var(--border);
      border-radius: var(--r); padding:1.5rem; box-shadow:0 4px 20px rgba(0,0,0,0.02);
      overflow-y: auto; max-height: calc(100vh - 120px);
    }
    .section-title {
      font-family: var(--fhead); font-size:1rem; font-weight:800;
      display: flex; align-items: center; gap:8px; margin-bottom:1rem;
    }
    .input-group { margin-bottom:1rem; }
    label { display: block; margin-bottom:4px; font-weight:600; font-size:0.85rem; color:var(--muted); }
    select, input[type="number"], input[type="range"] {
      width:100%; padding:10px 12px; border:1px solid var(--border);
      border-radius:10px; background: var(--bg); color: var(--text); font-size:14px;
    }
    input[type="range"] { padding:0; accent-color: var(--accent); }
    .range-row { display:flex; align-items: center; gap:10px; }
    .range-row span { min-width:40px; font-size:13px; }
    .btn {
      padding:10px 18px; border:none; border-radius:10px; font-weight:600;
      cursor:pointer; font-size:13px; display: inline-flex; align-items: center; gap:6px;
      transition: all 0.2s;
    }
    .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color:white; }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px var(--glow); }
    .btn-secondary { background: var(--bg); color: var(--text); border:1px solid var(--border); }
    .btn-secondary:hover { border-color: var(--accent); }
    .btn:disabled { opacity:0.5; cursor:not-allowed; }

    .stats-grid { display: flex; gap:15px; margin-top:1rem; }
    .stat-card {
      flex:1; background: var(--bg); padding:12px; border-radius:10px; text-align:center;
    }
    .stat-card strong { display:block; color: var(--accent); font-size:1.2rem; }

    /* Engine badge */
    .engine-badge {
      display: inline-flex; align-items: center; gap:6px;
      background: linear-gradient(135deg, rgba(236,72,153,0.12), rgba(167,139,250,0.12));
      border: 1px solid rgba(236,72,153,0.25);
      border-radius: 8px; padding: 6px 10px;
      font-size: 11px; font-weight: 700; color: var(--accent);
      margin-bottom: 1rem; width: 100%;
      font-family: 'JetBrains Mono', monospace;
    }
    .engine-badge .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--accent); animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity:1; transform:scale(1); }
      50% { opacity:0.5; transform:scale(0.8); }
    }

    /* Codec info pills */
    .codec-info {
      font-size: 11px; color: var(--muted); margin-top: 4px;
      font-family: 'JetBrains Mono', monospace;
    }

    /* Progress bar */
    .progress-wrap {
      width:100%; background: var(--bg); border-radius:8px;
      height:6px; margin-top:10px; overflow:hidden; display:none;
    }
    .progress-bar {
      height:100%; width:0%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius:8px; transition: width 0.3s;
    }

    footer { text-align:center; padding:2rem; color: var(--muted); font-size:0.9rem; border-top:1px solid var(--border); margin-top:auto; }
    .hidden { display:none !important; }

  <!-- ===================== SQUOOSH WASM CODECS ===================== -->
  <!--
    We load Squoosh's published WebAssembly codec modules from the
    official @squoosh/lib CDN mirrors. Each codec is a standalone WASM
    module that runs entirely in the browser — zero server uploads.

    Codecs used:
      • MozJPEG  — Mozilla's JPEG encoder (best-in-class JPEG compression)
      • WebP     — Google's WebP encoder (libwebp)
      • OxiPNG   — Rust-based lossless PNG optimizer
      • AVIF     — AOM AV1 Image encoder
      • JPEG XL  — libjxl encoder (future-proof format)

    CDN: unpkg.com/@squoosh/lib  (official npm package mirror)
    All WASM binaries are fetched and cached by the browser automatically.
  -->
  <script type="module">
    // ---------------------------------------------------------------
    // Squoosh ImagePool — wraps each WASM codec cleanly
    // We use the lower-level codec scripts directly for browser compat.
    // ---------------------------------------------------------------

    // ---- Utility: resize via OffscreenCanvas / regular canvas ----
    function resizeImageData(imageData, targetW, targetH) {
      const canvas = document.createElement('canvas');
      canvas.width = imageData.width;
      canvas.height = imageData.height;
      const ctx = canvas.getContext('2d');
      ctx.putImageData(imageData, 0, 0);

      const out = document.createElement('canvas');
      out.width = targetW;
      out.height = targetH;
      const octx = out.getContext('2d');
      octx.drawImage(canvas, 0, 0, targetW, targetH);
      return octx.getImageData(0, 0, targetW, targetH);
    }

    // ---- Get ImageData from File ----
    async function fileToImageData(file, maxW, maxH, keepRatio) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          URL.revokeObjectURL(url);
          let w = img.naturalWidth;
          let h = img.naturalHeight;
          if (keepRatio) {
            const ratio = Math.min(maxW / w, maxH / h);
            if (ratio < 1) { w = Math.round(w * ratio); h = Math.round(h * ratio); }
          } else {
            w = Math.min(w, maxW);
            h = Math.min(h, maxH);
          }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          resolve(ctx.getImageData(0, 0, w, h));
        };
        img.onerror = reject;
        img.src = url;
      });
    }

    // ---- Canvas fallback compressor (original engine, kept as safety net) ----
    async function canvasCompress(file, quality, mimeType, maxW, maxH, keepRatio) {
      const imageData = await fileToImageData(file, maxW, maxH, keepRatio);
      const canvas = document.createElement('canvas');
      canvas.width = imageData.width; canvas.height = imageData.height;
      canvas.getContext('2d').putImageData(imageData, 0, 0);
      return new Promise((resolve) => canvas.toBlob(resolve, mimeType, quality));
    }

    // ================================================================
    // SQUOOSH WASM CODEC LOADERS
    // Each codec is dynamically imported from unpkg CDN.
    // The codecs expose an `encode` function that takes ImageData + options
    // and returns a Uint8Array of compressed bytes.
    // ================================================================

    // Cache loaded codec modules
    const codecCache = {};

    async function loadCodec(name) {
      if (codecCache[name]) return codecCache[name];

      // Squoosh publishes individual codec WASM packages on npm.
      // We import the JS wrapper which auto-fetches the .wasm binary.
      const base = 'https://unpkg.com/@squoosh/lib@0.4.0/build/';

      let mod;
      try {
        switch(name) {
          case 'mozjpeg':
            mod = await import(base + 'mozjpeg/mozjpeg_enc.js');
            await mod.default();  // init WASM
            break;
          case 'webp':
            mod = await import(base + 'webp/webp_enc.js');
            await mod.default();
            break;
          case 'oxipng':
            mod = await import(base + 'oxipng/oxipng.js');
            await mod.default();
            break;
          case 'avif':
            mod = await import(base + 'avif/avif_enc.js');
            await mod.default();
            break;
          case 'jxl':
            mod = await import(base + 'jxl/jxl_enc.js');
            await mod.default();
            break;
        }
        codecCache[name] = mod;
      } catch(e) {
        console.warn(`Squoosh WASM codec "${name}" failed to load, using canvas fallback.`, e);
        return null;
      }
      return mod;
    }

    // ================================================================
    // MAIN ENCODE FUNCTION — Squoosh WASM first, canvas fallback
    // ================================================================
    async function squooshEncode(file, format, quality, maxW, maxH, keepRatio, targetBytes) {
      const imageData = await fileToImageData(file, maxW, maxH, keepRatio);
      const q01 = quality / 100; // normalize 0–1

      let bytes = null;
      let mime = 'image/jpeg';
      let ext  = 'jpg';

      // ---- Try Squoosh WASM codecs ----
      try {
        if (format === 'mozjpeg') {
          // MozJPEG: quality 0-100 integer
          const enc = await loadCodec('mozjpeg');
          if (enc && enc.encode) {
            bytes = enc.encode(imageData.data, imageData.width, imageData.height, {
              quality: Math.round(quality),
              baseline: false,
              arithmetic: false,
              progressive: true,
              optimize_coding: true,
              smoothing: 0,
              color_space: 3, // YCbCr
              quant_table: 3,
              trellis_multipass: false,
              trellis_opt_zero: false,
              trellis_opt_table: false,
              trellis_loops: 1,
              auto_subsample: true,
              chroma_subsample: 2,
              separate_chroma_quality: false,
              chroma_quality: 75,
            });
            mime = 'image/jpeg'; ext = 'jpg';
          }
        }

        else if (format === 'webp') {
          const enc = await loadCodec('webp');
          if (enc && enc.encode) {
            bytes = enc.encode(imageData.data, imageData.width, imageData.height, {
              quality: Math.round(quality),
              target_size: 0,
              target_PSNR: 0,
              method: 4,
              sns_strength: 50,
              filter_strength: 60,
              filter_sharpness: 0,
              filter_type: 1,
              partitions: 0,
              segments: 4,
              pass: 1,
              show_compressed: 0,
              preprocessing: 0,
              autofilter: 0,
              partition_limit: 0,
              alpha_compression: 1,
              alpha_filtering: 1,
              alpha_quality: 100,
              lossless: 0,
              exact: 0,
              image_hint: 0,
              emulate_jpeg_size: 0,
              thread_level: 0,
              low_memory: 0,
              near_lossless: 100,
              use_delta_palette: 0,
              use_sharp_yuv: 0,
            });
            mime = 'image/webp'; ext = 'webp';
          }
        }

        else if (format === 'oxipng') {
          const enc = await loadCodec('oxipng');
          if (enc && enc.encode) {
            // OxiPNG: first canvas-encode to PNG, then optimize
            const pngBlob = await canvasCompress(file, 1, 'image/png', maxW, maxH, keepRatio);
            const pngBuf  = await pngBlob.arrayBuffer();
            bytes = enc.encode(new Uint8Array(pngBuf), {
              level: 2,         // 0=fastest…6=smallest
              interlace: false,
            });
            mime = 'image/png'; ext = 'png';
          }
        }

        else if (format === 'avif') {
          const enc = await loadCodec('avif');
          if (enc && enc.encode) {
            bytes = enc.encode(imageData.data, imageData.width, imageData.height, {
              cqLevel:   Math.round(62 - (quality * 0.62)),  // inverse: lower = better
              cqAlphaLevel: -1,
              denoiseLevel: 0,
              tileColsLog2: 0,
              tileRowsLog2: 0,
              speed:  6,
              subsample: 1,
              chromaDeltaQ: false,
              sharpness: 0,
              tune: 0,
            });
            mime = 'image/avif'; ext = 'avif';
          }
        }

        else if (format === 'jxl') {
          const enc = await loadCodec('jxl');
          if (enc && enc.encode) {
            bytes = enc.encode(imageData.data, imageData.width, imageData.height, {
              effort: 7,
              quality: Math.round(quality),
              progressive: false,
              epf: -1,
              lossyPalette: false,
              decodingSpeedTier: 0,
              photonNoiseIso: 0,
              separation: 0,
            });
            mime = 'image/jxl'; ext = 'jxl';
          }
        }
      } catch(wasmErr) {
        console.warn('Squoosh encode error, falling back to canvas:', wasmErr);
        bytes = null;
      }

      // ---- Canvas fallback if WASM unavailable or failed ----
      if (!bytes) {
        const fmtMap = {
          'mozjpeg': 'image/jpeg', 'webp': 'image/webp',
          'oxipng': 'image/png',   'avif': 'image/avif',
          'jxl': 'image/jpeg',     'canvas-jpeg': 'image/jpeg', 'canvas-png': 'image/png'
        };
        const canvasMime = fmtMap[format] || 'image/jpeg';
        const extMap = { 'image/jpeg':'jpg','image/webp':'webp','image/png':'png','image/avif':'avif' };
        mime = canvasMime;
        ext  = extMap[canvasMime] || 'jpg';
        const blob = await canvasCompress(file, q01, canvasMime, maxW, maxH, keepRatio);
        return { blob, mime, ext };
      }

      // Convert Uint8Array → Blob
      let blob = new Blob([bytes], { type: mime });

      // ---- Target size: binary-search quality reduction (WASM path) ----
      if (targetBytes && blob.size > targetBytes && (format === 'mozjpeg' || format === 'webp')) {
        let lo = 5, hi = quality, bestBlob = blob;
        for (let iter = 0; iter < 8; iter++) {
          const mid = Math.round((lo + hi) / 2);
          let tryBytes = null;
          try {
            if (format === 'mozjpeg') {
              const enc = codecCache['mozjpeg'];
              tryBytes = enc.encode(imageData.data, imageData.width, imageData.height, { quality: mid, progressive: true, optimize_coding: true, color_space: 3, quant_table: 3, auto_subsample: true, chroma_subsample: 2, baseline: false, arithmetic: false, smoothing: 0, trellis_multipass: false, trellis_opt_zero: false, trellis_opt_table: false, trellis_loops: 1, separate_chroma_quality: false, chroma_quality: 75 });
            } else {
              const enc = codecCache['webp'];
              tryBytes = enc.encode(imageData.data, imageData.width, imageData.height, { quality: mid, method: 4, sns_strength: 50, filter_strength: 60, filter_sharpness: 0, filter_type: 1, partitions: 0, segments: 4, pass: 1, alpha_compression: 1, alpha_filtering: 1, alpha_quality: 100, lossless: 0, near_lossless: 100, target_size: 0, target_PSNR: 0, show_compressed: 0, preprocessing: 0, autofilter: 0, partition_limit: 0, exact: 0, image_hint: 0, emulate_jpeg_size: 0, thread_level: 0, low_memory: 0, use_delta_palette: 0, use_sharp_yuv: 0 });
            }
            const tryBlob = new Blob([tryBytes], { type: mime });
            if (tryBlob.size <= targetBytes) { bestBlob = tryBlob; lo = mid + 1; }
            else { hi = mid - 1; }
          } catch(e) { break; }
        }
        blob = bestBlob;
      }

      return { blob, mime, ext };
    }

    // ================================================================
    // UI WIRING  — identical to original, just calls squooshEncode()
    // ================================================================
    (function(){
      function syncTheme() {
        const saved = localStorage.getItem('pixelpress-theme');
        const theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      }
      document.getElementById('themeToggle').addEventListener('click', ()=>{
        const curr = document.documentElement.getAttribute('data-theme');
        const next = curr === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('pixelpress-theme', next);
      });

      const uploadedFiles    = [];
      const compressedResults = [];
      let currentPreviewIndex = 0;

      const dropZone          = document.getElementById('dropZone');
      const fileInput         = document.getElementById('fileInput');
      const batchInfo         = document.getElementById('batchInfo');
      const previewSection    = document.getElementById('previewSection');
      const originalImg       = document.getElementById('originalImg');
      const compressedImg     = document.getElementById('compressedImg');
      const comparisonRange   = document.getElementById('comparisonRange');
      const downloadSingleBtn = document.getElementById('downloadSingleBtn');
      const downloadBatchBtn  = document.getElementById('downloadBatchBtn');
      const clearBtn          = document.getElementById('clearBtn');
      const compressBtn       = document.getElementById('compressBtn');
      const qualitySlider     = document.getElementById('qualitySlider');
      const qualityValue      = document.getElementById('qualityValue');
      const formatSelect      = document.getElementById('formatSelect');
      const maxWidthEl        = document.getElementById('maxWidth');
      const maxHeightEl       = document.getElementById('maxHeight');
      const keepRatio         = document.getElementById('keepRatio');
      const targetSize        = document.getElementById('targetSize');
      const statsGrid         = document.getElementById('statsGrid');
      const origSizeEl        = document.getElementById('origSize');
      const compSizeEl        = document.getElementById('compSize');
      const savedPercentEl    = document.getElementById('savedPercent');
      const progressWrap      = document.getElementById('progressWrap');
      const progressBar       = document.getElementById('progressBar');
      const codecInfo         = document.getElementById('codecInfo');

      // Codec descriptions
      const codecDesc = {
        'mozjpeg':     'MozJPEG — up to 30% smaller than standard JPEG',
        'webp':        'WebP — 25-35% smaller than JPEG, alpha support',
        'oxipng':      'OxiPNG — lossless PNG, Rust-powered optimizer',
        'avif':        'AVIF — next-gen, 50% smaller than JPEG',
        'jxl':         'JPEG XL — future-proof, lossless & lossy',
        'canvas-jpeg': 'JPEG — standard canvas encoder (fallback)',
        'canvas-png':  'PNG — standard canvas encoder (fallback)',
      };
      formatSelect.addEventListener('change', () => {
        codecInfo.textContent = codecDesc[formatSelect.value] || '';
      });

      function formatBytes(bytes) {
        if (bytes === 0) return '0 B';
        const k = 1024, sizes = ['B','KB','MB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
      }

      function addFiles(files) {
        const imageFiles = Array.from(files).filter(f => f.type.startsWith('image/'));
        if (!imageFiles.length) { alert('No valid images selected.'); return; }
        imageFiles.forEach(f => {
          if (f.size > 25 * 1024 * 1024) { alert(`${f.name} exceeds 25MB limit.`); return; }
          uploadedFiles.push(f);
        });
        updateUI();
      }

      function updateUI() {
        if (!uploadedFiles.length) {
          batchInfo.textContent = ''; compressBtn.disabled = true;
          previewSection.classList.add('hidden');
        } else {
          batchInfo.innerHTML = `${uploadedFiles.length} image(s) loaded. <a href="#" id="resetFiles">Remove all</a>`;
          compressBtn.disabled = false;
          showOriginalPreview(0);
        }
        downloadBatchBtn.classList.toggle('hidden', uploadedFiles.length < 2 || compressedResults.length < uploadedFiles.length);
      }

      function showOriginalPreview(index) {
        if (index >= uploadedFiles.length) return;
        currentPreviewIndex = index;
        const reader = new FileReader();
        reader.onload = (e) => {
          originalImg.src = e.target.result;
          previewSection.classList.remove('hidden');
          compressedImg.src = '';
          comparisonRange.value = 50;
          updateComparisonSlider();
        };
        reader.readAsDataURL(uploadedFiles[index]);
      }

      comparisonRange.addEventListener('input', updateComparisonSlider);
      function updateComparisonSlider() {
        const val = comparisonRange.value;
        compressedImg.style.clipPath = `inset(0 ${100 - val}% 0 0)`;
      }

      // ---- Main compression runner ----
      async function runCompression() {
        if (!uploadedFiles.length) return;
        compressBtn.disabled = true;
        compressBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Compressing…';
        compressedResults.length = 0;

        const quality    = parseInt(qualitySlider.value);
        const format     = formatSelect.value;
        const maxW       = parseInt(maxWidthEl.value)  || 9999;
        const maxH       = parseInt(maxHeightEl.value) || 9999;
        const keep       = keepRatio.checked;
        const targetBytes = targetSize.value ? parseInt(targetSize.value) * 1024 : null;

        // Show progress bar
        progressWrap.style.display = 'block';
        progressBar.style.width = '0%';

        try {
          for (let i = 0; i < uploadedFiles.length; i++) {
            const file = uploadedFiles[i];

            // Canvas-only formats bypass WASM
            let result;
            if (format === 'canvas-jpeg' || format === 'canvas-png') {
              const mime = format === 'canvas-jpeg' ? 'image/jpeg' : 'image/png';
              const blob = await (async () => {
                const imageData = await (async (f, mW, mH, kr) => {
                  return new Promise((res, rej) => {
                    const img = new Image();
                    const url = URL.createObjectURL(f);
                    img.onload = () => {
                      URL.revokeObjectURL(url);
                      let w = img.naturalWidth, h = img.naturalHeight;
                      if (kr) { const r = Math.min(mW/w, mH/h); if (r<1){w=Math.round(w*r);h=Math.round(h*r);} }
                      else { w=Math.min(w,mW); h=Math.min(h,mH); }
                      const c = document.createElement('canvas');
                      c.width=w; c.height=h;
                      c.getContext('2d').drawImage(img,0,0,w,h);
                      res(c.getContext('2d').getImageData(0,0,w,h));
                    };
                    img.onerror=rej; img.src=url;
                  });
                })(file, maxW, maxH, keep);
                const c = document.createElement('canvas');
                c.width=imageData.width; c.height=imageData.height;
                c.getContext('2d').putImageData(imageData,0,0);
                return new Promise(res => c.toBlob(res, mime, quality/100));
              })();
              result = { blob, mime, ext: format==='canvas-jpeg'?'jpg':'png' };
            } else {
              result = await squooshEncode(file, format, quality, maxW, maxH, keep, targetBytes);
            }

            const baseName = file.name.replace(/\.[^/.]+$/, '');
            compressedResults.push({
              blob: result.blob,
              name: `${baseName}_compressed.${result.ext}`,
              size: result.blob.size
            });

            // Update progress
            progressBar.style.width = `${Math.round(((i + 1) / uploadedFiles.length) * 100)}%`;
          }

          // Show first compressed preview
          if (compressedResults.length > 0) {
            const url = URL.createObjectURL(compressedResults[0].blob);
            compressedImg.src = url;
            updateComparisonSlider();
          }

          // Stats
          const origTotal = uploadedFiles.reduce((a, f) => a + f.size, 0);
          const compTotal = compressedResults.reduce((a, r) => a + r.size, 0);
          origSizeEl.textContent    = formatBytes(origTotal);
          compSizeEl.textContent    = formatBytes(compTotal);
          const savings = origTotal > 0 ? ((origTotal - compTotal) / origTotal * 100).toFixed(1) : 0;
          savedPercentEl.textContent = savings + '%';
          statsGrid.classList.remove('hidden');
          updateUI();

        } catch(err) {
          alert('Compression error: ' + err.message);
        } finally {
          compressBtn.disabled = false;
          compressBtn.innerHTML = '<i class="fa-solid fa-compress"></i> Compress';
          setTimeout(() => { progressWrap.style.display = 'none'; progressBar.style.width = '0%'; }, 1000);
        }
      }

      // ---- Download handlers ----
      downloadSingleBtn.addEventListener('click', () => {
        if (!compressedResults.length) return;
        const res = compressedResults[currentPreviewIndex] || compressedResults[0];
        const a = document.createElement('a');
        a.href = URL.createObjectURL(res.blob);
        a.download = res.name; a.click();
      });

      downloadBatchBtn.addEventListener('click', async () => {
        if (compressedResults.length < 2) return;
        const zip = new JSZip();
        compressedResults.forEach(r => zip.file(r.name, r.blob));
        const content = await zip.generateAsync({ type: 'blob' });
        saveAs(content, 'compressed_images.zip');
      });

      clearBtn.addEventListener('click', () => {
        uploadedFiles.length = 0; compressedResults.length = 0;
        originalImg.src = ''; compressedImg.src = '';
        previewSection.classList.add('hidden');
        statsGrid.classList.add('hidden');
        updateUI(); compressBtn.disabled = true;
      });

      // ---- Event listeners ----
      dropZone.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', (e) => addFiles(e.target.files));
      dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.borderColor = 'var(--accent)'; });
      dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = 'var(--border)'; });
      dropZone.addEventListener('drop', (e) => {
        e.preventDefault(); dropZone.style.borderColor = 'var(--border)';
        if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
      });

      qualitySlider.addEventListener('input', () => { qualityValue.textContent = qualitySlider.value + '%'; });

      compressBtn.addEventListener('click', runCompression);

      batchInfo.addEventListener('click', (e) => {
        if (e.target.id === 'resetFiles') {
          e.preventDefault();
          uploadedFiles.length = 0; compressedResults.length = 0;
          originalImg.src = ''; compressedImg.src = '';
          previewSection.classList.add('hidden'); statsGrid.classList.add('hidden');
          updateUI(); compressBtn.disabled = true;
        }
      });

      syncTheme();
      updateUI();
    })();
  </script>
</body>
</html>
