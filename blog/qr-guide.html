    a{color:inherit;text-decoration:none}

    .hero h1{font-family:var(--fhead);font-size:clamp(1.8rem,4vw,2.5rem);font-weight:800;line-height:1.3;margin-bottom:.8rem}
    .meta{color:var(--muted);font-size:.85rem}
    .toc{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem;margin:2rem 0;position:sticky;top:80px}
    .toc h3{font-family:var(--fhead);margin-bottom:.8rem}
    .toc ol{padding-left:20px;color:var(--muted)}
    .toc li{margin-bottom:4px}
    .toc a{color:var(--accent);font-weight:500}
    .section{margin:2.5rem 0}

    .section p{color:var(--muted);line-height:1.9;margin-bottom:1rem}
    .section ul,.section ol{padding-left:24px;color:var(--muted);line-height:1.9;margin-bottom:1rem}
