<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favicon Generator – PixelPress</title>
  <meta name="description" content="Generate multi-size favicons for all browsers and devices. Free, client-side, instant download.">
  <link rel="canonical" href="https://pixelpress.pages.dev/favicon-generator.html">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap');
    :root{--bg:#f5f5f7;--card:#fff;--border:rgba(0,0,0,0.06);--text:#1d1d1f;--muted:#6e6e73;--accent:#ec4899;--accent2:#a78bfa;--r:16px}
    [data-theme="dark"]{--bg:#09090e;--card:#15151e;--border:rgba(255,255,255,0.08);--text:#e8e8f0;--muted:#86868b}
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;flex-direction:column;transition:0.3s}
    nav{position:sticky;top:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:64px;background:rgba(255,255,255,0.75);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
    [data-theme="dark"] nav{background:rgba(21,21,30,0.7)}
    .nav-left{display:flex;align-items:center;gap:1rem}
    .back-btn{background:var(--card);border:1px solid var(--border);width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text);font-size:1.1rem;cursor:pointer;text-decoration:none;transition:0.2s}
    .back-btn:hover{border-color:var(--accent);transform:scale(1.05)}
    .nav-logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1.25rem;text-transform:uppercase;text-decoration:none;color:inherit}
    .nav-logo span{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .main{flex:1;max-width:850px;margin:0 auto;width:100%;padding:2rem 16px 4rem}
    h1{font-family:'Syne',sans-serif;font-size:2rem;text-align:center;margin-bottom:0.5rem}
    .subtitle{text-align:center;color:var(--muted);margin-bottom:2rem;font-size:0.9rem}
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:1.5rem;margin-bottom:1.5rem}
    .upload-zone{border:2px dashed var(--border);border-radius:var(--r);padding:2rem;text-align:center;cursor:pointer;transition:0.2s}
    .upload-zone:hover{border-color:var(--accent);background:rgba(236,72,153,0.03)}
    .upload-zone i{font-size:2.5rem;color:var(--accent)}
    .upload-zone input{display:none}
    
    .settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:1rem}
    @media(max-width:500px){.settings-grid{grid-template-columns:1fr}}
    .setting{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--bg);border-radius:10px;border:1px solid var(--border);cursor:pointer;font-size:0.85rem;font-weight:500;transition:0.2s}
    .setting:hover{border-color:var(--accent)}
    .setting input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
    
    .preview-scroll{display:flex;gap:16px;overflow-x:auto;padding:1rem 0;scrollbar-width:thin}
    .preview-item{flex-shrink:0;text-align:center;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px}
    .preview-item canvas{border-radius:4px;background:white}
    .preview-item p{font-size:0.7rem;color:var(--muted);margin-top:6px}
    
    .btn{width:100%;padding:14px;border:none;border-radius:10px;font-weight:600;cursor:pointer;font-size:1rem;transition:0.2s;display:flex;align-items:center;justify-content:center;gap:8px}
    .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:white}
    .btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(236,72,153,0.3)}
    .btn:disabled{opacity:0.5;pointer-events:none}
    .btn-success{background:#10b981;color:white}
    
    .info-row{display:flex;gap:20px;flex-wrap:wrap;margin-top:1rem}
    .info-chip{flex:1;min-width:100px;text-align:center;padding:12px;background:var(--bg);border-radius:8px;border:1px solid var(--border)}
    .info-chip strong{display:block;font-size:1.1rem;color:var(--accent)}
    .info-chip span{font-size:0.7rem;color:var(--muted)}
    
    footer{text-align:center;padding:2rem;color:var(--muted);font-size:0.85rem;border-top:1px solid var(--border);margin-top:auto}
  </style>
</head>
<body>
  <nav>
    <div class="nav-left"><a href="./index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a><a href="./index.html" class="nav-logo">PIXEL<span>PRESS</span></a></div>
    <button id="themeToggle" class="back-btn">🌓</button>
  </nav>
  <div class="main">
    <h1>🎯 Favicon Generator</h1>
    <p class="subtitle">Generate all standard favicon sizes from any image — free, client‑side, instant ZIP download</p>

    <div class="card">
      <div class="upload-zone" id="uploadZone">
        <i class="fa-solid fa-cloud-upload"></i>
        <h3 style="margin:0.5rem 0">Drop image or click to upload</h3>
        <p style="color:var(--muted);font-size:0.85rem">PNG with transparency recommended</p>
        <input type="file" id="fileInput" accept="image/*" />
      </div>

      <div class="settings-grid" id="sizeSettings" style="display:none">
        <label class="setting"><input type="checkbox" checked data-size="16"> 16×16</label>
        <label class="setting"><input type="checkbox" checked data-size="32"> 32×32</label>
        <label class="setting"><input type="checkbox" checked data-size="48"> 48×48</label>
        <label class="setting"><input type="checkbox" checked data-size="64"> 64×64</label>
        <label class="setting"><input type="checkbox" checked data-size="96"> 96×96</label>
        <label class="setting"><input type="checkbox" checked data-size="128"> 128×128</label>
        <label class="setting"><input type="checkbox" checked data-size="180"> 180×180 (Apple)</label>
        <label class="setting"><input type="checkbox" checked data-size="192"> 192×192 (Android)</label>
        <label class="setting"><input type="checkbox" checked data-size="256"> 256×256</label>
        <label class="setting"><input type="checkbox" checked data-size="512"> 512×512 (PWA)</label>
      </div>

      <div class="preview-scroll" id="previewContainer" style="display:none"></div>

      <div class="info-row" id="infoRow" style="display:none">
        <div class="info-chip"><strong id="origSize">—</strong><span>Original</span></div>
        <div class="info-chip"><strong id="selCount">0</strong><span>Sizes Selected</span></div>
        <div class="info-chip"><strong id="totalPixels">—</strong><span>Total Pixels</span></div>
      </div>

      <button class="btn btn-primary" id="downloadZipBtn" disabled><i class="fa-solid fa-file-zipper"></i> Download All as ZIP</button>
      <button class="btn btn-primary" id="downloadIcoBtn" disabled style="margin-top:8px"><i class="fa-solid fa-file"></i> Download .ICO (multi‑size)</button>
    </div>
  </div>
  <footer>© 2026 PixelPress – All processing happens in your browser</footer>

  <script>
    (function(){
      function syncTheme(){const s=localStorage.getItem('pixelpress-theme');document.documentElement.setAttribute('data-theme',s||(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))}
      document.getElementById('themeToggle').addEventListener('click',()=>{const c=document.documentElement.getAttribute('data-theme');const n=c==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);localStorage.setItem('pixelpress-theme',n)});
      syncTheme();

      let sourceImage=null;
      const uploadZone=document.getElementById('uploadZone');
      const fileInput=document.getElementById('fileInput');
      const previewContainer=document.getElementById('previewContainer');
      const downloadZipBtn=document.getElementById('downloadZipBtn');
      const downloadIcoBtn=document.getElementById('downloadIcoBtn');
      const sizeSettings=document.getElementById('sizeSettings');
      const infoRow=document.getElementById('infoRow');

      uploadZone.addEventListener('click',()=>fileInput.click());
      fileInput.addEventListener('change',handleFile);
      uploadZone.addEventListener('dragover',e=>{e.preventDefault();uploadZone.style.borderColor='var(--accent)'});
      uploadZone.addEventListener('dragleave',()=>uploadZone.style.borderColor='var(--border)');
      uploadZone.addEventListener('drop',e=>{e.preventDefault();uploadZone.style.borderColor='var(--border)';if(e.dataTransfer.files[0])loadImage(e.dataTransfer.files[0])});

      function handleFile(e){if(e.target.files[0])loadImage(e.target.files[0])}

      function loadImage(file){
        const reader=new FileReader();
        reader.onload=ev=>{
          const img=new Image();
          img.onload=()=>{
            sourceImage=img;
            document.getElementById('origSize').textContent=img.width+'×'+img.height;
            sizeSettings.style.display='grid';
            previewContainer.style.display='flex';
            infoRow.style.display='flex';
            downloadZipBtn.disabled=false;
            downloadIcoBtn.disabled=false;
            renderPreviews();
          };
          img.src=ev.target.result;
        };
        reader.readAsDataURL(file);
        fileInput.value='';
      }

      function getSelectedSizes(){
        return [...document.querySelectorAll('#sizeSettings input:checked')].map(cb=>parseInt(cb.dataset.size));
      }

      function renderPreviews(){
        if(!sourceImage) return;
        const sizes=getSelectedSizes();
        document.getElementById('selCount').textContent=sizes.length;
        let total=0;
        previewContainer.innerHTML=sizes.map(s=>{
          total+=s*s;
          return `<div class="preview-item"><canvas id="canvas${s}" width="${s}" height="${s}"></canvas><p>${s}×${s}</p></div>`;
        }).join('');
        document.getElementById('totalPixels').textContent=total.toLocaleString();
        sizes.forEach(s=>{
          const c=document.getElementById('canvas'+s);
          const ctx=c.getContext('2d');
          ctx.drawImage(sourceImage,0,0,s,s);
        });
      }

      // Listen for checkbox changes
      sizeSettings.addEventListener('change',renderPreviews);

      // Download ZIP
      downloadZipBtn.addEventListener('click',async()=>{
        if(!sourceImage) return;
        const zip=new JSZip();
        const sizes=getSelectedSizes();
        sizes.forEach(s=>{
          const c=document.getElementById('canvas'+s);
          const dataUrl=c.toDataURL('image/png');
          zip.file(`favicon-${s}x${s}.png`,dataUrl.split(',')[1],{base64:true});
        });
        const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE'});
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a');
        a.href=url;a.download='favicon-pack.zip';a.click();
        URL.revokeObjectURL(url);
      });

      // Download ICO
      downloadIcoBtn.addEventListener('click',()=>{
        if(!sourceImage) return;
        const sizes=getSelectedSizes().filter(s=>s<=256);
        const canvas=document.createElement('canvas');
        canvas.width=256;canvas.height=256;
        const ctx=canvas.getContext('2d');
        ctx.drawImage(sourceImage,0,0,256,256);
        canvas.toBlob(blob=>{
          const url=URL.createObjectURL(blob);
          const a=document.createElement('a');
          a.href=url;a.download='favicon.ico';a.click();
          URL.revokeObjectURL(url);
        },'image/x-icon');
      });
    })();
  </script>
</body>
</html>
