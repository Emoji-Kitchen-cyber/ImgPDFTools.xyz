    let currentLang = 'en';

    function renderUI() {
      const data = languageData[currentLang];
      document.getElementById('siteTitle').innerText = data.title;
      document.getElementById('langText').innerText = data.labelText;
      document.getElementById('heroTitle').innerHTML = data.heroTitle;
      document.getElementById('heroDesc').innerText = data.heroDesc;
      document.getElementById('footerCopyright').innerText = data.copyright;
      document.getElementById('noResults').innerText = data.noResultsText;
      document.getElementById('toolSearch').placeholder = data.searchPlaceholder;
      
      const filterBox = document.getElementById('filterContainer');
      filterBox.innerHTML = '';
      data.filters.forEach((f, i) => {
        const btn = document.createElement('button');
        btn.className = `filter-pill ${i === 0 ? 'active' : ''}`;
        btn.innerText = f.text;
        btn.setAttribute('data-target', f.id);
        btn.onclick = function() { filterCategory(f.id, this); };
        filterBox.appendChild(btn);
      });

      const toolsGrid = document.getElementById('toolsList');
      toolsGrid.innerHTML = '';
      data.toolsRegistry.filter(item => item.isUtilityCard).forEach(t => {
        toolsGrid.innerHTML += `<a href="${t.href}" class="tool-link" data-category="${t.cat}"><div class="tool-card"><div class="tool-icon-wrapper">${t.emoji}</div><div class="tool-info-pane"><h3>${t.title}</h3><p>${t.desc}</p></div></div></a>`;
      });

      const fLinks = document.getElementById('footerLinks');
      fLinks.innerHTML = data.footer.map(item => `<a href="${item.href}">${item.text}</a>`).join('');

      const sidebarBox = document.getElementById('sidebarLinks');
      sidebarBox.innerHTML = '';
      const homeLink = data.toolsRegistry.find(item => item.section === 'home');
      if (homeLink) sidebarBox.innerHTML += `<a href="${homeLink.href}"><i class="fa-solid ${homeLink.icon}"></i> ${homeLink.text}</a>`;
      ['image','doc','utility'].forEach(sec => {
        sidebarBox.innerHTML += `<div class="menu-section-title">${data.sidebarTitles[sec]}</div>`;
        data.toolsRegistry.filter(item => item.section === sec).forEach(item => {
          sidebarBox.innerHTML += `<a href="${item.href}"><i class="fa-solid ${item.icon}"></i> ${item.text}</a>`;
        });
      });
      sidebarBox.innerHTML += `<div style="height:1px;background:var(--border);margin:10px 0;"></div><div class="menu-section-title">${data.sidebarTitles.info}</div>`;
      data.toolsRegistry.filter(item => item.section === 'info').forEach(item => {
        sidebarBox.innerHTML += `<a href="${item.href}"><i class="fa-solid ${item.icon}"></i> ${item.text}</a>`;
      });
      evaluateLiveSearchFilters();
    }

    function toggleLanguage() {
      const btn = document.getElementById('langToggleBtn');
      currentLang = currentLang === 'en' ? 'ar' : 'en';
      document.body.classList.toggle('rtl', currentLang === 'ar');
      btn.classList.toggle('active', currentLang === 'en');
      document.documentElement.lang = currentLang;
      renderUI();
    }

    const searchInput = document.getElementById('toolSearch');
    function evaluateLiveSearchFilters() {
      const query = searchInput.value.toLowerCase().trim();
      const activePill = document.querySelector('.filter-pill.active');
      const targetCategory = activePill ? activePill.getAttribute('data-target') : 'all';
      let count = 0;
      document.querySelectorAll('.tool-link').forEach(link => {
        const title = link.querySelector('h3').textContent.toLowerCase();
        const desc = link.querySelector('p').textContent.toLowerCase();
        const cats = link.getAttribute('data-category').split(' ');
        const match = (title.includes(query) || desc.includes(query)) && (targetCategory === 'all' || cats.includes(targetCategory));
        link.classList.toggle('hidden', !match);
        if (match) count++;
      });
      document.getElementById('noResults').style.display = count === 0 ? 'block' : 'none';
    }

    function filterCategory(category, element) {
      document.querySelectorAll('.filter-pill').forEach(btn => { btn.classList.remove('active'); btn.setAttribute('aria-pressed', 'false'); });
      element.classList.add('active');
      element.setAttribute('aria-pressed', 'true');
      evaluateLiveSearchFilters();
    }

    searchInput.addEventListener('input', evaluateLiveSearchFilters);

    function toggleMenu(show) {
      document.getElementById('sideMenu').classList.toggle('open', show);
      document.getElementById('menuOverlay').classList.toggle('show', show);
    }

    document.getElementById('themeToggle').addEventListener('click', () => {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('pixelpress-theme', next);
    });

    window.addEventListener('keydown', e => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); searchInput.focus(); }
    });

    renderUI();
  </script>

  <script>
    (function() {
      const hash = window.location.hash;
      if (hash.startsWith('#/s/')) {
        const shortId = hash.replace('#/s/', '').split('?')[0];
        const stored = localStorage.getItem(`redirect_${shortId}`);
        if (stored) {
          const entry = JSON.parse(stored);
          if (entry.expiry && Date.now() > entry.expiry) {
            document.body.innerHTML = '<div style="text-align:center;padding:4rem;"><h2>Link Expired</h2><a href="./index.html">Go Home</a></div>';
          } else {
            entry.clicks = (entry.clicks || 0) + 1;
            localStorage.setItem(`redirect_${shortId}`, JSON.stringify(entry));
            window.location.replace(entry.long);
          }
        } else {
          document.body.innerHTML = '<div style="text-align:center;padding:4rem;"><h2>URL Not Found</h2><a href="./index.html">Go Home</a></div>';
        }
      }
    })();
  </script>
