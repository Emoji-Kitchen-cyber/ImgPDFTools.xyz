<style>
:root{
  --bg:#f8f8fc; --bg2:#f0f0f8; --surface:rgba(255,255,255,0.90); --card:#ffffff;
  --border:rgba(99,102,241,0.10); --border2:rgba(0,0,0,0.06);
  --text:#18181b; --muted:#71717a;
  --accent:#6366f1; --accent2:#8b5cf6; --accent3:#06b6d4;
  --glow:rgba(99,102,241,0.14); --r:16px;
  --fhead:'Space Grotesk',sans-serif;
  --fbody:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
[data-theme="dark"]{
  --bg:#0c0c14; --bg2:#111120; --surface:rgba(18,18,30,0.92); --card:#16162a;
  --border:rgba(99,102,241,0.18); --border2:rgba(255,255,255,0.07);
  --text:#e4e4f0; --muted:#8888aa; --glow:rgba(99,102,241,0.28);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:var(--fbody);min-height:100vh;display:flex;flex-direction:column;transition:background .3s,color .3s;-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none;}
button,select,input{font-family:inherit;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

nav{position:sticky;top:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(1rem,5vw,3rem);height:64px;background:var(--surface);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);border-bottom:1px solid var(--border);}
.nav-left{display:flex;align-items:center;gap:1rem;}
.back-btn{background:var(--card);border:1px solid var(--border2);width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text);font-size:1rem;cursor:pointer;text-decoration:none;transition:transform .2s,border-color .2s,box-shadow .2s;}
.back-btn:hover{border-color:var(--accent);transform:scale(1.06);box-shadow:0 0 0 3px var(--glow);}
.nav-logo{display:flex;align-items:center;gap:8px;font-family:var(--fhead);font-weight:700;font-size:1.15rem;letter-spacing:-.3px;}
.logo-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 4px 14px var(--glow);flex-shrink:0;}
.logo-text-img{color:var(--text);}
.logo-text-pdf{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.logo-text-tools{color:var(--muted);font-weight:600;}

.main{flex:1;display:flex;flex-direction:column;max-width:1400px;margin:0 auto;width:100%;padding:1rem;}
.upload-section{flex:1;display:flex;align-items:center;justify-content:center;min-height:60vh;}
.upload-zone{border:2px dashed var(--border2);border-radius:var(--r);padding:clamp(2rem,6vw,4rem);text-align:center;cursor:pointer;transition:.2s;background:var(--card);}
.upload-zone:hover,.upload-zone.dragover{border-color:var(--accent);background:var(--glow);}
.upload-zone i{font-size:3rem;color:var(--accent);}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;padding:12px 0;border-bottom:1px solid var(--border2);}
.tool-btn,.tool-select{padding:8px 13px;border:1px solid var(--border2);border-radius:10px;background:var(--card);color:var(--text);cursor:pointer;font-size:13px;display:flex;align-items:center;gap:6px;transition:.18s;}
.tool-btn:hover,.tool-select:hover{border-color:var(--accent);color:var(--accent);}
.tool-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.workspace{display:flex;gap:1rem;flex:1;min-height:0;padding:1rem 0;}
.canvas-container{flex:1;background:repeating-conic-gradient(#80808020 0% 25%,transparent 0% 50%) 50% / 20px 20px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;overflow:auto;position:relative;min-height:300px;}
canvas{max-width:100%;max-height:80vh;box-shadow:0 8px 30px rgba(0,0,0,0.15);}
.side-panel{width:280px;background:var(--card);border:1px solid var(--border2);border-radius:var(--r);padding:1rem;display:flex;flex-direction:column;gap:1rem;overflow-y:auto;}
@media(max-width:900px){.workspace{flex-direction:column;}.side-panel{width:100%;}}
.section-title{font-family:var(--fhead);font-weight:700;font-size:14px;margin-bottom:6px;}
.layers-list{list-style:none;max-height:200px;overflow-y:auto;}
.layer-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer;border:1px solid transparent;}
.layer-item.active{border-color:var(--accent);background:var(--glow);}
.layer-thumb{width:40px;height:40px;object-fit:cover;border-radius:4px;background:var(--bg);}
.layer-info{flex:1;font-size:12px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.layer-actions{display:flex;gap:4px;}
.layer-actions button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;}
.slider-group{display:flex;align-items:center;gap:8px;font-size:13px;}
.slider-group span{min-width:64px;}
input[type="range"]{flex:1;accent-color:var(--accent);}
.hidden{display:none !important;}
.filter-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;}
.filter-grid button{padding:6px;font-size:12px;justify-content:center;}
footer{text-align:center;padding:1rem;color:var(--muted);font-size:.85rem;border-top:1px solid var(--border2);margin-top:auto;background:var(--card);}
</style>

  <script>
    (function(){
      'use strict';
      // ===== THEME SYNC (shared key with main site) =====
      const themeToggle = document.getElementById('themeToggle');
      themeToggle.addEventListener('click', () => {
        const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('imgpdftools-theme', next);
      });

      // ===== DOM =====
      const uploadSection = document.getElementById('uploadSection');
      const editorSection = document.getElementById('editorSection');
      const dropZone = document.getElementById('dropZone');
      const fileInput = document.getElementById('fileInput');
      const mainCanvas = document.getElementById('mainCanvas');
      const mainCtx = mainCanvas.getContext('2d');
      const layersList = document.getElementById('layersList');
      const statusBar = document.getElementById('statusBar');
      const colorPicker = document.getElementById('colorPicker');
      const brushSizeSel = document.getElementById('brushSize');
      const ADJ_IDS = ['brightness','contrast','saturation','blurRadius'];

      // ===== LAYER SYSTEM =====
      class Layer {
        constructor(name, width, height){
          this.name = name;
          this.canvas = document.createElement('canvas');
          this.canvas.width = width; this.canvas.height = height;
          this.ctx = this.canvas.getContext('2d');
          this.visible = true; this.opacity = 1; this.blendMode = 'normal';
        }
        getDataURL(){ return this.canvas.toDataURL(); }
        drawImage(img,x=0,y=0,w,h){ if(w&&h) this.ctx.drawImage(img,x,y,w,h); else this.ctx.drawImage(img,x,y); }
      }
      class LayerManager {
        constructor(mainCanvas){ this.mainCanvas=mainCanvas; this.mainCtx=mainCanvas.getContext('2d'); this.layers=[]; this.activeLayerIndex=-1; }
        addLayer(name,width,height){ const w=width||this.mainCanvas.width,h=height||this.mainCanvas.height; const l=new Layer(name,w,h); this.layers.push(l); this.activeLayerIndex=this.layers.length-1; return l; }
        removeLayer(i){ if(this.layers.length<=1) return false; this.layers.splice(i,1); if(this.activeLayerIndex>=this.layers.length) this.activeLayerIndex=this.layers.length-1; if(this.activeLayerIndex<0) this.activeLayerIndex=0; return true; }
        getActiveLayer(){ return this.layers[this.activeLayerIndex]; }
        setActiveLayer(i){ if(i>=0&&i<this.layers.length) this.activeLayerIndex=i; }
        composite(){ const ctx=this.mainCtx; ctx.clearRect(0,0,this.mainCanvas.width,this.mainCanvas.height); for(const l of this.layers){ if(!l.visible) continue; ctx.save(); ctx.globalAlpha=l.opacity; ctx.globalCompositeOperation=l.blendMode; ctx.drawImage(l.canvas,0,0); ctx.restore(); } }
        reset(img){ this.layers=[]; this.mainCanvas.width=img.width; this.mainCanvas.height=img.height; this.addLayer('Background',img.width,img.height); this.getActiveLayer().drawImage(img); this.composite(); }
      }

      let layerManager=null, originalImage=null, currentTool='select';
      let isDrawing=false, startX, startY, cropRect=null;
      let adjustBase=null; // non-destructive adjustment base snapshot

      // ===== HISTORY =====
      let historyStack=[], historyIndex=-1; const MAX_HISTORY=50;
      function pushHistory(){ const snap=mainCanvas.toDataURL(); if(historyIndex<historyStack.length-1) historyStack=historyStack.slice(0,historyIndex+1); historyStack.push(snap); if(historyStack.length>MAX_HISTORY) historyStack.shift(); historyIndex=historyStack.length-1; }
      function undo(){ if(historyIndex>0){ historyIndex--; loadSnapshot(historyStack[historyIndex]); } }
      function redo(){ if(historyIndex<historyStack.length-1){ historyIndex++; loadSnapshot(historyStack[historyIndex]); } }
      function loadSnapshot(dataUrl){ const img=new Image(); img.onload=()=>{ mainCanvas.width=img.width; mainCanvas.height=img.height; const active=layerManager.getActiveLayer(); if(active){ active.canvas.width=img.width; active.canvas.height=img.height; active.ctx.clearRect(0,0,img.width,img.height); active.ctx.drawImage(img,0,0);} layerManager.composite(); clearAdjust(); renderLayers(); status('Undo/Redo'); }; img.src=dataUrl; }

      // ===== ADJUSTMENTS (non-destructive) =====
      function clearAdjust(){ adjustBase=null; ADJ_IDS.forEach(id=>{ document.getElementById(id).value=0; }); }
      function captureAdjustBase(){ const a=layerManager&&layerManager.getActiveLayer(); if(!a){ adjustBase=null; return; } adjustBase=document.createElement('canvas'); adjustBase.width=a.canvas.width; adjustBase.height=a.canvas.height; adjustBase.getContext('2d').drawImage(a.canvas,0,0); }
      function applyAdjustment(){ if(!layerManager) return; const a=layerManager.getActiveLayer(); if(!a) return; if(!adjustBase) captureAdjustBase(); if(!adjustBase) return; const b=+document.getElementById('brightness').value, c=+document.getElementById('contrast').value, s=+document.getElementById('saturation').value, bl=+document.getElementById('blurRadius').value; a.ctx.clearRect(0,0,a.canvas.width,a.canvas.height); a.ctx.filter='brightness('+(100+b)+'%) contrast('+(100+c)+'%) saturate('+(100+s)+'%) blur('+bl+'px)'; a.ctx.drawImage(adjustBase,0,0); a.ctx.filter='none'; layerManager.composite(); }
      function commitAdjustment(){ if(!adjustBase) return; pushHistory(); clearAdjust(); status('Adjusted'); }

      // ===== UI HELPERS =====
      function status(msg){ statusBar.textContent=msg; }
      function renderLayers(){
        if(!layerManager) return;
        layersList.innerHTML = layerManager.layers.map((layer,i)=>
          '<li class="layer-item '+(i===layerManager.activeLayerIndex?'active':'')+'" data-index="'+i+'">'+
            '<img class="layer-thumb" src="'+layer.getDataURL()+'" alt="thumb" />'+
            '<div class="layer-info">'+layer.name+'</div>'+
            '<div class="layer-actions"><button class="layer-vis-btn" data-idx="'+i+'"><i class="fa-solid '+(layer.visible?'fa-eye':'fa-eye-slash')+'"></i></button></div>'+
          '</li>').join('');
        document.querySelectorAll('.layer-item').forEach(li=>{
          li.addEventListener('click',e=>{ if(e.target.closest('button')) return; layerManager.setActiveLayer(parseInt(li.dataset.index)); clearAdjust(); renderLayers(); updateLayerUI(); status('Active: '+layerManager.getActiveLayer().name); });
        });
        document.querySelectorAll('.layer-vis-btn').forEach(btn=>{
          btn.addEventListener('click',e=>{ e.stopPropagation(); const idx=parseInt(btn.dataset.idx); layerManager.layers[idx].visible=!layerManager.layers[idx].visible; layerManager.composite(); renderLayers(); pushHistory(); });
        });
      }
      function updateLayerUI(){ const a=layerManager.getActiveLayer(); if(!a) return; document.getElementById('layerOpacity').value=a.opacity; document.getElementById('layerBlend').value=a.blendMode; }

      // ===== TOOLS =====
      document.getElementById('toolbar').addEventListener('click',e=>{ const btn=e.target.closest('button'); if(!btn||!btn.dataset.tool) return; currentTool=btn.dataset.tool; document.querySelectorAll('.tool-btn[data-tool]').forEach(b=>b.classList.remove('active')); if(currentTool!=='select') btn.classList.add('active'); cropRect=null; status('Tool: '+currentTool); });

      function getPos(e){ const rect=mainCanvas.getBoundingClientRect(); const sx=mainCanvas.width/rect.width, sy=mainCanvas.height/rect.height; const cx=e.touches?e.touches[0].clientX:e.clientX, cy=e.touches?e.touches[0].clientY:e.clientY; return { x:(cx-rect.left)*sx, y:(cy-rect.top)*sy }; }

      mainCanvas.addEventListener('mousedown',onStart);
      mainCanvas.addEventListener('mousemove',onMove);
      mainCanvas.addEventListener('mouseup',onEnd);
      mainCanvas.addEventListener('touchstart',e=>{e.preventDefault();onStart(e);},{passive:false});
      mainCanvas.addEventListener('touchmove',e=>{e.preventDefault();onMove(e);},{passive:false});
      mainCanvas.addEventListener('touchend',onEnd);

      function onStart(e){
        const pos=getPos(e); const a=layerManager&&layerManager.getActiveLayer(); if(!a) return;
        if(currentTool==='draw'||currentTool==='eraser'){
          isDrawing=true; startX=pos.x; startY=pos.y; a.ctx.beginPath(); a.ctx.moveTo(pos.x,pos.y);
          a.ctx.lineWidth=parseInt(brushSizeSel.value); a.ctx.lineCap='round'; a.ctx.lineJoin='round';
          if(currentTool==='eraser'){ a.ctx.globalCompositeOperation='destination-out'; }
          else { a.ctx.globalCompositeOperation='source-over'; a.ctx.strokeStyle=colorPicker.value; }
        } else if(currentTool==='line'||currentTool==='rect'||currentTool==='circle'){ isDrawing=true; startX=pos.x; startY=pos.y; }
        else if(currentTool==='crop'){ cropRect={x:pos.x,y:pos.y,w:0,h:0}; }
        else if(currentTool==='text'){ const t=prompt('Enter text:','Hello'); if(t){ a.ctx.globalCompositeOperation='source-over'; a.ctx.font='30px '+getComputedStyle(document.body).getPropertyValue('--fbody'); a.ctx.fillStyle=colorPicker.value; a.ctx.fillText(t,pos.x,pos.y); layerManager.composite(); pushHistory(); status('Text added'); } resetToSelect(); }
        else if(currentTool==='sticker'){ const em=prompt('Enter emoji (e.g. 😂):','😂'); if(em){ a.ctx.globalCompositeOperation='source-over'; a.ctx.font='50px serif'; a.ctx.fillText(em,pos.x,pos.y); layerManager.composite(); pushHistory(); status('Sticker added'); } resetToSelect(); }
      }
      function resetToSelect(){ currentTool='select'; document.querySelectorAll('.tool-btn[data-tool]').forEach(b=>b.classList.remove('active')); }

      function onMove(e){
        if(!isDrawing && !(currentTool==='crop'&&cropRect)) return;
        const pos=getPos(e); const a=layerManager&&layerManager.getActiveLayer(); if(!a) return;
        if(currentTool==='draw'||currentTool==='eraser'){ a.ctx.lineTo(pos.x,pos.y); a.ctx.stroke(); layerManager.composite(); }
        else if(currentTool==='line'){ layerManager.composite(); mainCtx.save(); mainCtx.strokeStyle=colorPicker.value; mainCtx.lineWidth=parseInt(brushSizeSel.value); mainCtx.beginPath(); mainCtx.moveTo(startX,startY); mainCtx.lineTo(pos.x,pos.y); mainCtx.stroke(); mainCtx.restore(); }
        else if(currentTool==='rect'){ layerManager.composite(); mainCtx.save(); mainCtx.strokeStyle=colorPicker.value; mainCtx.lineWidth=2; mainCtx.strokeRect(startX,startY,pos.x-startX,pos.y-startY); mainCtx.restore(); }
        else if(currentTool==='circle'){ layerManager.composite(); mainCtx.save(); mainCtx.strokeStyle=colorPicker.value; mainCtx.lineWidth=2; const r=Math.hypot(pos.x-startX,pos.y-startY); mainCtx.beginPath(); mainCtx.arc(startX,startY,r,0,Math.PI*2); mainCtx.stroke(); mainCtx.restore(); }
        else if(currentTool==='crop'&&cropRect){ cropRect.w=pos.x-cropRect.x; cropRect.h=pos.y-cropRect.y; layerManager.composite(); mainCtx.save(); mainCtx.strokeStyle='#6366f1'; mainCtx.lineWidth=2; mainCtx.setLineDash([6,4]); mainCtx.strokeRect(cropRect.x,cropRect.y,cropRect.w,cropRect.h); mainCtx.restore(); }
      }

      function onEnd(e){
        const a=layerManager&&layerManager.getActiveLayer();
        if(a && isDrawing && (currentTool==='line'||currentTool==='rect'||currentTool==='circle')){
          const pos=getPos(e); a.ctx.globalCompositeOperation='source-over'; a.ctx.strokeStyle=colorPicker.value; a.ctx.fillStyle=colorPicker.value; a.ctx.lineWidth=parseInt(brushSizeSel.value);
          if(currentTool==='line'){ a.ctx.beginPath(); a.ctx.moveTo(startX,startY); a.ctx.lineTo(pos.x,pos.y); a.ctx.stroke(); }
          else if(currentTool==='rect'){ a.ctx.strokeRect(startX,startY,pos.x-startX,pos.y-startY); }
          else if(currentTool==='circle'){ const r=Math.hypot(pos.x-startX,pos.y-startY); a.ctx.beginPath(); a.ctx.arc(startX,startY,r,0,Math.PI*2); a.ctx.stroke(); }
          layerManager.composite(); pushHistory();
        } else if(currentTool==='crop'&&cropRect){ applyCrop(cropRect); cropRect=null; }
        else if(a && isDrawing && (currentTool==='draw'||currentTool==='eraser')){ a.ctx.globalCompositeOperation='source-over'; layerManager.composite(); pushHistory(); }
        isDrawing=false;
      }

      function applyCrop(rect){
        const w=Math.abs(rect.w), h=Math.abs(rect.h); if(w<5||h<5){ layerManager.composite(); return; }
        const x=Math.min(rect.x,rect.x+rect.w), y=Math.min(rect.y,rect.y+rect.h);
        layerManager.composite();
        const imageData=mainCtx.getImageData(x,y,w,h);
        mainCanvas.width=w; mainCanvas.height=h; mainCtx.putImageData(imageData,0,0);
        const flat=new Layer('Background',w,h); flat.ctx.drawImage(mainCanvas,0,0);
        layerManager.layers=[flat]; layerManager.activeLayerIndex=0; layerManager.composite();
        clearAdjust(); renderLayers(); resetToSelect(); pushHistory(); status('Cropped');
      }

      // ===== IMAGE LOADING =====
      function loadImage(file){
        if(!file || !file.type || !file.type.startsWith('image/')){ alert('Please choose a valid image file.'); return; }
        const reader=new FileReader();
        reader.onload=ev=>{ const img=new Image(); img.onload=()=>{ originalImage=img; layerManager=new LayerManager(mainCanvas); layerManager.reset(img); historyStack=[mainCanvas.toDataURL()]; historyIndex=0; clearAdjust(); uploadSection.classList.add('hidden'); editorSection.classList.remove('hidden'); renderLayers(); updateLayerUI(); status('Image loaded'); }; img.onerror=()=>alert('Could not load this image.'); img.src=ev.target.result; };
        reader.readAsDataURL(file);
      }
      dropZone.addEventListener('click',()=>fileInput.click());
      fileInput.addEventListener('change',e=>{ if(e.target.files[0]) loadImage(e.target.files[0]); fileInput.value=''; });
      dropZone.addEventListener('dragover',e=>{ e.preventDefault(); dropZone.classList.add('dragover'); });
      dropZone.addEventListener('dragleave',()=>dropZone.classList.remove('dragover'));
      dropZone.addEventListener('drop',e=>{ e.preventDefault(); dropZone.classList.remove('dragover'); if(e.dataTransfer.files[0]) loadImage(e.dataTransfer.files[0]); });

      // ===== BUTTONS =====
      document.getElementById('undoBtn').addEventListener('click',undo);
      document.getElementById('redoBtn').addEventListener('click',redo);
      document.addEventListener('keydown',e=>{ if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){ e.preventDefault(); if(e.shiftKey) redo(); else undo(); } });

      document.getElementById('addLayerBtn').addEventListener('click',()=>{ layerManager.addLayer('Layer '+(layerManager.layers.length+1)); layerManager.composite(); clearAdjust(); renderLayers(); pushHistory(); });
      document.getElementById('deleteLayerBtn').addEventListener('click',()=>{ if(layerManager.removeLayer(layerManager.activeLayerIndex)){ layerManager.composite(); clearAdjust(); renderLayers(); pushHistory(); } });
      document.getElementById('duplicateLayerBtn').addEventListener('click',()=>{ const a=layerManager.getActiveLayer(); const n=layerManager.addLayer(a.name+' copy'); n.ctx.drawImage(a.canvas,0,0); layerManager.composite(); clearAdjust(); renderLayers(); pushHistory(); });
      document.getElementById('layerOpacity').addEventListener('input',e=>{ const a=layerManager.getActiveLayer(); if(a){ a.opacity=parseFloat(e.target.value); layerManager.composite(); } });
      document.getElementById('layerOpacity').addEventListener('change',()=>pushHistory());
      document.getElementById('layerBlend').addEventListener('change',e=>{ const a=layerManager.getActiveLayer(); if(a){ a.blendMode=e.target.value; layerManager.composite(); pushHistory(); } });

      ADJ_IDS.forEach(id=>{ const el=document.getElementById(id); el.addEventListener('input',applyAdjustment); el.addEventListener('change',commitAdjustment); });

      // ===== FILTERS =====
      function applyFilter(type){
        if(!layerManager) return; const a=layerManager.getActiveLayer();
        const imgData=a.ctx.getImageData(0,0,a.canvas.width,a.canvas.height); const d=imgData.data;
        if(type==='grayscale'){ for(let i=0;i<d.length;i+=4){ const avg=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2]; d[i]=d[i+1]=d[i+2]=avg; } }
        else if(type==='sepia'){ for(let i=0;i<d.length;i+=4){ const r=d[i],g=d[i+1],b=d[i+2]; d[i]=Math.min(255,r*0.393+g*0.769+b*0.189); d[i+1]=Math.min(255,r*0.349+g*0.686+b*0.168); d[i+2]=Math.min(255,r*0.272+g*0.534+b*0.131); } }
        else if(type==='invert'){ for(let i=0;i<d.length;i+=4){ d[i]=255-d[i]; d[i+1]=255-d[i+1]; d[i+2]=255-d[i+2]; } }
        else if(type==='vintage'){ for(let i=0;i<d.length;i+=4){ d[i]=Math.min(255,d[i]*1.1); d[i+2]=Math.max(0,d[i+2]*0.9); } }
        a.ctx.putImageData(imgData,0,0); layerManager.composite(); clearAdjust(); pushHistory(); status('Filter applied');
      }
      document.getElementById('filterNone').addEventListener('click',()=>{ loadSnapshot(historyStack[historyIndex]); });
      document.getElementById('filterGrayscale').addEventListener('click',()=>applyFilter('grayscale'));
      document.getElementById('filterSepia').addEventListener('click',()=>applyFilter('sepia'));
      document.getElementById('filterInvert').addEventListener('click',()=>applyFilter('invert'));
      document.getElementById('filterVintage').addEventListener('click',()=>applyFilter('vintage'));
      document.getElementById('autoEnhanceBtn').addEventListener('click',()=>{
        if(!layerManager) return; const a=layerManager.getActiveLayer();
        const imgData=a.ctx.getImageData(0,0,a.canvas.width,a.canvas.height); const d=imgData.data;
        let min=255,max=0; for(let i=0;i<d.length;i+=4){ const g=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2]; if(g<min)min=g; if(g>max)max=g; }
        if(max===min) return; const range=max-min;
        for(let i=0;i<d.length;i+=4){ d[i]=(d[i]-min)/range*255; d[i+1]=(d[i+1]-min)/range*255; d[i+2]=(d[i+2]-min)/range*255; }
        a.ctx.putImageData(imgData,0,0); layerManager.composite(); clearAdjust(); pushHistory(); status('Enhanced');
      });

      // ===== AI BACKGROUND REMOVAL (robust lib detection) =====
      function resolveBgRemoval(){
        const lib = window.imglyBackgroundRemoval || window['@imgly/background-removal'] || window.removeBackground;
        if(!lib) return null;
        if(typeof lib==='function') return lib;
        if(typeof lib.removeBackground==='function') return lib.removeBackground;
        return null;
      }
      document.getElementById('bgRemoveBtn').addEventListener('click',async()=>{
        const removeBg=resolveBgRemoval();
        if(!removeBg){ alert('Background removal library not loaded. Please check your connection and reload.'); return; }
        status('Removing background… (first run downloads the AI model)');
        try{
          const blob=await (await fetch(mainCanvas.toDataURL())).blob();
          const resultBlob=await removeBg(blob,{ output:{ format:'image/png' } });
          const url=URL.createObjectURL(resultBlob); const img=new Image();
          img.onload=()=>{ const n=layerManager.addLayer('No BG'); n.ctx.drawImage(img,0,0); layerManager.composite(); clearAdjust(); renderLayers(); pushHistory(); status('Background removed'); URL.revokeObjectURL(url); };
          img.src=url;
        }catch(err){ alert('Error: '+(err&&err.message?err.message:err)); status('Error'); }
      });

      // ===== WATERMARK =====
      document.getElementById('watermarkBtn').addEventListener('click',()=>{
        const text=prompt('Watermark text:','© ImgPDFTools'); if(!text) return;
        const a=layerManager.getActiveLayer(); a.ctx.save(); a.ctx.globalCompositeOperation='source-over'; a.ctx.globalAlpha=0.5; a.ctx.font='bold 30px '+getComputedStyle(document.body).getPropertyValue('--fbody'); a.ctx.fillStyle='#ffffff'; a.ctx.strokeStyle='rgba(0,0,0,0.4)'; a.ctx.lineWidth=1; a.ctx.fillText(text,20,mainCanvas.height-20); a.ctx.strokeText(text,20,mainCanvas.height-20); a.ctx.restore(); layerManager.composite(); clearAdjust(); pushHistory(); status('Watermark added');
      });

      document.getElementById('resetBtn').addEventListener('click',()=>{ if(originalImage){ layerManager.reset(originalImage); clearAdjust(); pushHistory(); renderLayers(); status('Reset'); } });

      document.getElementById('downloadBtn').addEventListener('click',()=>{
        let fmt=(prompt('Format (png/jpeg/webp):','png')||'png').toLowerCase().trim();
        if(!['png','jpeg','jpg','webp'].includes(fmt)){ alert('Unsupported format. Use png, jpeg or webp.'); return; }
        if(fmt==='jpg') fmt='jpeg';
        const link=document.createElement('a'); link.download='imgpdftools_edited.'+(fmt==='jpeg'?'jpg':fmt); link.href=mainCanvas.toDataURL('image/'+fmt,0.92); link.click();
      });

      status('Upload an image to start');
    })();
  </script>
</body>
</html>
